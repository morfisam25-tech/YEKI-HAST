name: API Bundle Export

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace links
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Bundle API
        run: |
          npx --yes esbuild@0.25.9 api/index.ts \
            --bundle \
            --platform=node \
            --target=node22 \
            --format=esm \
            --external:pg \
            --minify \
            --outfile=dist-api/index.mjs
          wc -c dist-api/index.mjs
          cat > dist-api/package.json <<'JSON'
          {
            "name": "yeki-hast-api-runtime",
            "private": true,
            "type": "module",
            "dependencies": { "pg": "^8.23.0" },
            "engines": { "node": ">=22.13.0" }
          }
          JSON
          cat > dist-api/vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": null,
            "rewrites": [
              { "source": "/health", "destination": "/api/index" },
              { "source": "/ready", "destination": "/api/index" },
              { "source": "/v1/:path*", "destination": "/api/index" }
            ]
          }
          JSON
          mkdir -p dist-api/api
          mv dist-api/index.mjs dist-api/api/index.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: yeki-hast-api-bundle
          path: dist-api
          retention-days: 1
