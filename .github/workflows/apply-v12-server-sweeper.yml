name: Apply v1.2 server sweeper patch

on:
  push:
    branches: [feat/v1-2-internet-voice-foundation]
    paths:
      - .github/workflows/apply-v12-server-sweeper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v1-2-internet-voice-foundation

      - name: Apply exact locally-tested patch
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip

          MIG_B64 = ""
          TEST_B64 = ""

          Path('packages/db/migrations/0006_internet_voice_server_sweeper.sql').write_bytes(gzip.decompress(base64.b64decode(MIG_B64)))
          Path('tests/internet-voice-server-sweeper.test.ts').write_bytes(gzip.decompress(base64.b64decode(TEST_B64)))

          def once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {s.count(old)}')
              p.write_text(s.replace(old, new, 1))

          # 0003: platform spread is a GENERATED column; only its source rates may be updated.
          once('packages/db/migrations/0003_internet_voice_transport.sql',
               '    platform_spread_per_minute_minor=12000,\n', '', 'generated spread assignment')

          # Migration runner.
          once('packages/db/src/migrate.ts',
               "  {\n    filename: '0005_no_answer_hold_idempotency.sql',\n    path: join(migrationsDir, '0005_no_answer_hold_idempotency.sql'),\n  },\n",
               "  {\n    filename: '0005_no_answer_hold_idempotency.sql',\n    path: join(migrationsDir, '0005_no_answer_hold_idempotency.sql'),\n  },\n  {\n    filename: '0006_internet_voice_server_sweeper.sql',\n    path: join(migrationsDir, '0006_internet_voice_server_sweeper.sql'),\n  },\n", 'migration runner')

          # Persist explicit server timestamps used by the DB-owned sweeper.
          once('services/api/src/routes/internet-voice.ts',
               "      UPDATE app.call_sessions\n      SET status='calling_listener', transport='internet_voice',\n          transport_session_id=$2, updated_at=now()\n      WHERE id=$1 AND status='routing' AND transport IS NULL AND transport_session_id IS NULL\n",
               "      UPDATE app.call_sessions\n      SET status='calling_listener', transport='internet_voice',\n          transport_session_id=$2,\n          voice_offer_started_at=COALESCE(voice_offer_started_at,now()),\n          updated_at=now()\n      WHERE id=$1 AND status='routing' AND transport IS NULL AND transport_session_id IS NULL\n", 'offer timestamp')
          once('services/api/src/routes/internet-voice.ts',
               "    if (kind === 'offer' && role !== 'caller') throw new HttpError(403, 'voice_offer_caller_only');\n    if (kind === 'answer' && role !== 'listener') throw new HttpError(403, 'voice_answer_listener_only');\n\n    await deleteExpiredSignals(client);\n",
               "    if (kind === 'offer' && role !== 'caller') throw new HttpError(403, 'voice_offer_caller_only');\n    if (kind === 'answer' && role !== 'listener') throw new HttpError(403, 'voice_answer_listener_only');\n\n    if (kind === 'answer' && role === 'listener') {\n      await client.query(`\n        UPDATE app.call_sessions\n        SET voice_listener_answered_at=COALESCE(voice_listener_answered_at,now()),\n            updated_at=now()\n        WHERE id=$1 AND status='calling_listener' AND transport='internet_voice'\n      `, [rawCallId]);\n    }\n\n    await deleteExpiredSignals(client);\n", 'answer timestamp')

          # Production readiness migration hashes and scheduler checks.
          p = Path('api/index.ts'); s = p.read_text()
          s = s.replace("['0003_internet_voice_transport.sql', '369ad1642a0cb2abe42f6b241c5024434b9308829ad31d697ca8f7edc7ec5225']", "['0003_internet_voice_transport.sql', '5a2943f0cf6238776b607836b3b3bbf0b464ba0548e80373db781ce1a7c9359d']")
          s = s.replace("  ['0005_no_answer_hold_idempotency.sql', '7456314e4969ba9536f21ca3c9de0ab4f665ba6f236cddea5832a43601b0ef3c'],\n]);", "  ['0005_no_answer_hold_idempotency.sql', '7456314e4969ba9536f21ca3c9de0ab4f665ba6f236cddea5832a43601b0ef3c'],\n  ['0006_internet_voice_server_sweeper.sql', 'efb704ec5b6233364f6987a347ecd48b4315728dc9c0ddb0f0e8b4b3b4d0f254'],\n]);")
          s = s.replace("version: '0.0.10'", "version: '0.0.11'")
          s = s.replace("        call_reservations_ready: boolean;\n", "        call_reservations_ready: boolean;\n        pg_cron_ready: boolean;\n        internet_voice_sweeper_ready: boolean;\n")
          s = s.replace("          to_regclass('app.call_reservations') IS NOT NULL AS call_reservations_ready\n", "          to_regclass('app.call_reservations') IS NOT NULL AS call_reservations_ready,\n          EXISTS (SELECT 1 FROM pg_extension WHERE extname='pg_cron') AS pg_cron_ready,\n          to_regprocedure('app.sweep_internet_voice_sessions(integer)') IS NOT NULL AS internet_voice_sweeper_ready\n")
          s = s.replace("        && row?.call_reservations_ready\n", "        && row?.call_reservations_ready\n        && row?.pg_cron_ready\n        && row?.internet_voice_sweeper_ready\n")
          s = s.replace("          callReservations: Boolean(row?.call_reservations_ready),\n", "          callReservations: Boolean(row?.call_reservations_ready),\n          pgCron: Boolean(row?.pg_cron_ready),\n          internetVoiceSweeper: Boolean(row?.internet_voice_sweeper_ready),\n")
          s = s.replace("          '0005_no_answer_hold_idempotency.sql'\n", "          '0005_no_answer_hold_idempotency.sql',\n          '0006_internet_voice_server_sweeper.sql'\n")
          marker = "      const migrations = await pool.query<{ filename: string; sha256: string }>(`\n"
          if marker not in s: raise SystemExit('readiness migration marker missing')
          cron = """      const cronJob = await pool.query(`
        SELECT 1
        FROM cron.job
        WHERE jobname='yeki_hast_internet_voice_sweep'
          AND schedule='* * * * *'
          AND active=true
        LIMIT 1
      `);
      if (!cronJob.rowCount) {
        console.error('readiness_internet_voice_sweeper_job_missing');
        sendJson(res, 503, { ok: false, error: 'service_not_ready' });
        return;
      }

"""
          s = s.replace(marker, cron + marker, 1)
          p.write_text(s)

          # Production preflight accepts only a valid prefix of the locked migration chain.
          p = Path('scripts/preflight-production-db-migration.mjs'); s = p.read_text()
          a = s.index('const expectedMigrations = new Map(['); b = s.index(']);', a) + 3
          decl = """const expectedMigrationEntries = [
  ['0001_initial.sql', 'f3a6d566b8298c6ef00b10ab1efe91a313e307101297fa35d817270335ed2e09'],
  ['0002_email_auth.sql', '3e748e17f9a51ce27513cf03a459e7152ac74b63af32e43ff3478c514584fd90'],
  ['0003_internet_voice_transport.sql', '5a2943f0cf6238776b607836b3b3bbf0b464ba0548e80373db781ce1a7c9359d'],
  ['0004_booking.sql', '63f4070bdd1b6f89cca95eaa63a681ec31a246f13ac10a14ba814f98d887d4e3'],
  ['0005_no_answer_hold_idempotency.sql', '7456314e4969ba9536f21ca3c9de0ab4f665ba6f236cddea5832a43601b0ef3c'],
  ['0006_internet_voice_server_sweeper.sql', 'efb704ec5b6233364f6987a347ecd48b4315728dc9c0ddb0f0e8b4b3b4d0f254'],
];
const expectedMigrations = new Map(expectedMigrationEntries);
"""
          s = s[:a] + decl + s[b:]
          old = """    const applied = new Map();
    for (const migration of migrations.rows) {
      const filename = String(migration.filename ?? '');
      const sha256 = String(migration.sha256 ?? '');
      const expectedSha = expectedMigrations.get(filename);
      if (!expectedSha) throw new Error(`unexpected production migration record: ${filename || 'unknown'}`);
      if (sha256 !== expectedSha) throw new Error(`production migration hash mismatch: ${filename}`);
      applied.set(filename, sha256);
    }

    if (applied.has('0002_email_auth.sql') && !applied.has('0001_initial.sql')) {
      throw new Error('production migration history is out of order');
    }
"""
          new = """    const applied = new Map();
    for (let index = 0; index < migrations.rows.length; index += 1) {
      const migration = migrations.rows[index];
      const filename = String(migration.filename ?? '');
      const sha256 = String(migration.sha256 ?? '');
      const expectedEntry = expectedMigrationEntries[index];
      if (!expectedEntry || filename !== expectedEntry[0]) {
        throw new Error(`production migration history is out of order or unexpected: ${filename || 'unknown'}`);
      }
      const expectedSha = expectedMigrations.get(filename);
      if (sha256 !== expectedSha) throw new Error(`production migration hash mismatch: ${filename}`);
      applied.set(filename, sha256);
    }

"""
          if old not in s: raise SystemExit('preflight loop missing')
          p.write_text(s.replace(old, new, 1))

          # Full production verifier requires all six migrations and the scheduled DB job.
          p = Path('scripts/verify-production-db.mjs'); s = p.read_text()
          s = s.replace("    ['0002_email_auth.sql', '3e748e17f9a51ce27513cf03a459e7152ac74b63af32e43ff3478c514584fd90'],\n  ]);", "    ['0002_email_auth.sql', '3e748e17f9a51ce27513cf03a459e7152ac74b63af32e43ff3478c514584fd90'],\n    ['0003_internet_voice_transport.sql', '5a2943f0cf6238776b607836b3b3bbf0b464ba0548e80373db781ce1a7c9359d'],\n    ['0004_booking.sql', '63f4070bdd1b6f89cca95eaa63a681ec31a246f13ac10a14ba814f98d887d4e3'],\n    ['0005_no_answer_hold_idempotency.sql', '7456314e4969ba9536f21ca3c9de0ab4f665ba6f236cddea5832a43601b0ef3c'],\n    ['0006_internet_voice_server_sweeper.sql', 'efb704ec5b6233364f6987a347ecd48b4315728dc9c0ddb0f0e8b4b3b4d0f254'],\n  ]);")
          s = s.replace("    'app.wallet_transactions',\n    'app.payment_attempts',\n", "    'app.wallet_transactions',\n    'app.wallet_hold_events',\n    'app.internet_voice_signals',\n    'app.listener_availability',\n    'app.call_reservations',\n    'app.payment_attempts',\n")
          marker = "  const emailSchema = await pool.query(`\n"
          checks = """  const sweeper = await pool.query(`
    SELECT
      EXISTS (SELECT 1 FROM pg_extension WHERE extname='pg_cron') AS pg_cron,
      to_regprocedure('app.expire_internet_voice_preconnect(uuid,text)') IS NOT NULL AS preconnect_fn,
      to_regprocedure('app.settle_internet_voice_call(uuid,text,text,boolean)') IS NOT NULL AS settlement_fn,
      to_regprocedure('app.sweep_internet_voice_sessions(integer)') IS NOT NULL AS sweep_fn
  `);
  const sweeperRow = sweeper.rows[0] ?? {};
  if (sweeperRow.pg_cron !== true) throw new Error('pg_cron extension missing');
  if (sweeperRow.preconnect_fn !== true) throw new Error('Internet Voice preconnect finalizer missing');
  if (sweeperRow.settlement_fn !== true) throw new Error('Internet Voice settlement function missing');
  if (sweeperRow.sweep_fn !== true) throw new Error('Internet Voice sweeper function missing');

  const cronJob = await pool.query(`
    SELECT 1 FROM cron.job
    WHERE jobname='yeki_hast_internet_voice_sweep'
      AND schedule='* * * * *' AND active=true
    LIMIT 1
  `);
  if (!cronJob.rowCount) throw new Error('Internet Voice sweeper cron job missing');

"""
          if marker not in s: raise SystemExit('verify marker missing')
          p.write_text(s.replace(marker, checks + marker, 1))

          # Existing booking/readiness guard now covers the full migration chain.
          p = Path('tests/booking-v12-guard.test.ts'); s = p.read_text()
          s = s.replace("  assert.match(migrate, /0004_booking\\.sql/);", "  assert.match(migrate, /0004_booking\\.sql/);\n  assert.match(migrate, /0005_no_answer_hold_idempotency\\.sql/);\n  assert.match(migrate, /0006_internet_voice_server_sweeper\\.sql/);")
          s = s.replace("  assert.match(ready, /0004_booking\\.sql/);", "  assert.match(ready, /0004_booking\\.sql/);\n  assert.match(ready, /0005_no_answer_hold_idempotency\\.sql/);\n  assert.match(ready, /0006_internet_voice_server_sweeper\\.sql/);\n  assert.match(ready, /sweep_internet_voice_sessions/);")
          p.write_text(s)

      - name: Verify patch hashes and focused guards
        shell: bash
        run: |
          set -euo pipefail
          echo '5a2943f0cf6238776b607836b3b3bbf0b464ba0548e80373db781ce1a7c9359d  packages/db/migrations/0003_internet_voice_transport.sql' | sha256sum -c -
          echo 'efb704ec5b6233364f6987a347ecd48b4315728dc9c0ddb0f0e8b4b3b4d0f254  packages/db/migrations/0006_internet_voice_server_sweeper.sql' | sha256sum -c -
          node --experimental-strip-types --test tests/internet-voice-server-sweeper.test.ts tests/booking-v12-guard.test.ts
          git diff --check

      - name: Commit patch to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add packages/db/migrations/0003_internet_voice_transport.sql \
                  packages/db/migrations/0006_internet_voice_server_sweeper.sql \
                  packages/db/src/migrate.ts api/index.ts \
                  scripts/preflight-production-db-migration.mjs scripts/verify-production-db.mjs \
                  services/api/src/routes/internet-voice.ts \
                  tests/booking-v12-guard.test.ts tests/internet-voice-server-sweeper.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: enforce Internet Voice expiry and caps server-side'
          git push origin HEAD:feat/v1-2-internet-voice-foundation
