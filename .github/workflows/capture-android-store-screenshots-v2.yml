name: Capture Android Store Screenshots V2

on:
  push:
    branches:
      - release/android-store-screenshots-v2-20260905

permissions:
  contents: read

env:
  EAS_AAB_URL: https://expo.dev/artifacts/eas/N_O0IVKRoZqvrc6Dgd8s72XF0VS52-y3TmZ4cF4trLA.aab
  EXPECTED_AAB_SHA256: 8cbf19c57352ad8aa2a8d08c01e48e7d9f76581f3d05c36e99264a4df8d43cd3
  BUNDLETOOL_VERSION: 1.18.3
  PACKAGE: app.yekihast.mobile

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout screenshot tooling
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download exact final AAB and prepare screenshot APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/yeki-hast-final.aab "$EAS_AAB_URL"
          echo "$EXPECTED_AAB_SHA256  /tmp/yeki-hast-final.aab" | sha256sum --check
          curl --fail --location --retry 3 \
            --output /tmp/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          keytool -genkeypair -noprompt \
            -keystore /tmp/screenshot.jks \
            -storepass android \
            -keypass android \
            -alias screenshot \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Screenshot QA,O=Yeki Hast,C=TR'
          java -jar /tmp/bundletool.jar build-apks \
            --bundle=/tmp/yeki-hast-final.aab \
            --output=/tmp/yeki-hast-final.apks \
            --mode=universal \
            --ks=/tmp/screenshot.jks \
            --ks-pass=pass:android \
            --ks-key-alias=screenshot \
            --key-pass=pass:android
          unzip -p /tmp/yeki-hast-final.apks universal.apk > /tmp/yeki-hast-final.apk
          test -s /tmp/yeki-hast-final.apk
          echo 'Final release screenshot APK prepared from exact vc3 AAB'

      - name: Capture actual Android UI on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            mkdir -p android-store-screenshots
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb install -r /tmp/yeki-hast-final.apk

            launch_app() {
              adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
              sleep 8
            }

            capture() {
              local name="$1"
              adb exec-out screencap -p > "android-store-screenshots/${name}.png"
              test -s "android-store-screenshots/${name}.png"
            }

            tap_text() {
              local needle="$1"
              local xml=/tmp/window.xml
              for attempt in 1 2 3 4 5; do
                adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
                adb pull /sdcard/window.xml "$xml" >/dev/null 2>&1 || true
                if [ -s "$xml" ]; then
                  coords="$(python3 - "$needle" "$xml" <<'PY'
            import re, sys, xml.etree.ElementTree as ET
            needle, path = sys.argv[1], sys.argv[2]
            try:
                root = ET.parse(path).getroot()
            except Exception:
                raise SystemExit(1)
            for node in root.iter('node'):
                vals = [node.attrib.get('text',''), node.attrib.get('content-desc','')]
                if any(needle in v for v in vals if v):
                    m = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
                    if m:
                        x1,y1,x2,y2 = map(int,m.groups())
                        print((x1+x2)//2, (y1+y2)//2)
                        raise SystemExit(0)
            raise SystemExit(1)
            PY
            )" && {
                    adb shell input tap $coords
                    sleep 3
                    return 0
                  }
                fi
                sleep 2
              done
              echo "UI text not found: $needle" >&2
              cat "$xml" >&2 || true
              return 1
            }

            launch_app
            capture 01-home
            tap_text 'می‌خوام شنونده بشم'
            capture 02-listener-intro
            tap_text 'ادامه با ایمیل'
            capture 03-email-auth

            adb shell pm clear "$PACKAGE" >/dev/null
            launch_app
            tap_text 'اطلاعات شروع Caller'
            capture 04-caller-closed

            python3 - <<'PY'
            import pathlib, struct
            paths = sorted(pathlib.Path('android-store-screenshots').glob('*.png'))
            assert len(paths) == 4, [p.name for p in paths]
            for p in paths:
                data = p.read_bytes()
                assert data[:8] == b'\x89PNG\r\n\x1a\n', p
                w,h = struct.unpack('>II', data[16:24])
                print(p.name, w, h, len(data))
                assert (w,h) == (1080,1920), (p,w,h)
            print('ANDROID_STORE_SCREENSHOTS=PASS')
            PY

      - name: Upload final Google Play screenshots
        uses: actions/upload-artifact@v4
        with:
          name: yeki-hast-google-play-screenshots-v1.0.0-vc3
          path: android-store-screenshots/*.png
          if-no-files-found: error
          retention-days: 90
