name: Credential Availability Check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
      EMAIL_HASH_PEPPER: ${{ secrets.EMAIL_HASH_PEPPER }}
      IP_HASH_PEPPER: ${{ secrets.IP_HASH_PEPPER }}
      OTP_HASH_PEPPER: ${{ secrets.OTP_HASH_PEPPER }}
      ACTIVE_DATA_ENCRYPTION_KEY_ID: ${{ secrets.ACTIVE_DATA_ENCRYPTION_KEY_ID }}
      DATA_ENCRYPTION_KEYS: ${{ secrets.DATA_ENCRYPTION_KEYS }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          for name in DATABASE_URL VERCEL_TOKEN EMAIL_PROVIDER SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USERNAME SMTP_PASSWORD SMTP_FROM_EMAIL EMAIL_HASH_PEPPER IP_HASH_PEPPER OTP_HASH_PEPPER ACTIVE_DATA_ENCRYPTION_KEY_ID DATA_ENCRYPTION_KEYS; do
            if [ -n "${!name}" ]; then
              echo "$name=set"
            else
              echo "$name=unset"
            fi
          done
