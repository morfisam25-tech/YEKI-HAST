name: Deploy Production API

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-PRODUCTION-API to confirm manual release'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: yeki-hast-production-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_SMTP_HOST: ${{ secrets.PRODUCTION_SMTP_HOST }}
      PRODUCTION_SMTP_PORT: ${{ secrets.PRODUCTION_SMTP_PORT }}
      PRODUCTION_SMTP_SECURE: ${{ secrets.PRODUCTION_SMTP_SECURE }}
      PRODUCTION_SMTP_USERNAME: ${{ secrets.PRODUCTION_SMTP_USERNAME }}
      PRODUCTION_SMTP_PASSWORD: ${{ secrets.PRODUCTION_SMTP_PASSWORD }}
      PRODUCTION_SMTP_FROM_EMAIL: ${{ secrets.PRODUCTION_SMTP_FROM_EMAIL }}
      PRODUCTION_SMTP_FROM_NAME: ${{ secrets.PRODUCTION_SMTP_FROM_NAME }}
      PRODUCTION_PRIVACY_POLICY_URL: ${{ secrets.PRODUCTION_PRIVACY_POLICY_URL }}
      PRODUCTION_TERMS_OF_SERVICE_URL: ${{ secrets.PRODUCTION_TERMS_OF_SERVICE_URL }}
      PRODUCTION_ACCOUNT_DELETION_URL: ${{ secrets.PRODUCTION_ACCOUNT_DELETION_URL }}
      PRODUCTION_COMMERCIAL_HOSTING_APPROVED: ${{ vars.PRODUCTION_COMMERCIAL_HOSTING_APPROVED }}
      VERCEL_TEAM_ID: team_GmseY3ibD05FWemVhLElL3hI
      VERCEL_TEAM_SLUG: unique-6ff0
      VERCEL_PROJECT_ID: prj_ijhc8kDsH24eQK5TfhFOqW8RVSxy
      API_PRODUCTION_URL: https://yeki-hast-theta.vercel.app
      VERCEL_BIN: ${{ github.workspace }}/node_modules/.bin/vercel
      ESBUILD_BIN: ${{ github.workspace }}/node_modules/.bin/esbuild
    steps:
      - name: Require main branch and launch credentials
        shell: bash
        env:
          MANUAL_CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys are allowed only from main"
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "morfisam25-tech/YEKI-HAST" ]; then
            echo "::error::Unexpected repository"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "${MANUAL_CONFIRM:-}" != "DEPLOY-PRODUCTION-API" ]; then
            echo "::error::Production API deploy requires a manual dispatch with the exact confirmation phrase"
            exit 1
          fi
          missing=()
          for name in VERCEL_TOKEN PRODUCTION_DATABASE_URL PRODUCTION_SMTP_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required repository secret(s): %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Checkout exact source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require explicitly approved aws-us-east-1 database target
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const approval = readFileSync('.launch/production-db-migration', 'utf8').trim();
          if (approval.startsWith('blocked=')) throw new Error('production DB target is still blocked pending correct aws-us-east-1 project');
          const match = /^approved=\d{4}-\d{2}-\d{2};project=([a-z0-9-]+);region=aws-us-east-1;host_sha256=([0-9a-f]{64})$/.exec(approval);
          if (!match) throw new Error('production DB target approval is missing or malformed');
          const raw = process.env.DATABASE_URL?.trim();
          if (!raw) throw new Error('DATABASE_URL is required');
          const url = new URL(raw);
          if (!['postgres:', 'postgresql:'].includes(url.protocol)) throw new Error('production DB URL must be PostgreSQL');
          if (!url.username || !url.password) throw new Error('production DB URL credential is incomplete');
          if (!url.hostname.endsWith('.us-east-1.aws.neon.tech')) throw new Error('production DB host is not Neon aws-us-east-1');
          if (url.pathname !== '/neondb') throw new Error('production DB database must be neondb');
          if (url.searchParams.get('sslmode') !== 'require') throw new Error('production DB must require TLS');
          if (url.searchParams.get('channel_binding') !== 'require') throw new Error('production DB must require channel binding');
          const actualHostSha256 = createHash('sha256').update(url.hostname).digest('hex');
          if (actualHostSha256 !== match[2]) throw new Error('production DB endpoint fingerprint does not match approved target');
          console.log('production DB deployment target guard PASS (credentials and endpoint hidden)');
          NODE

      - name: Require validated workspace dependency lock
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            echo '::error::package-lock.json is required before production API deployment'
            exit 1
          fi

      - name: Setup exact Node used by release tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Require successful Foundation QA coverage for this source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/require-green-foundation-qa.mjs

      - name: Install workspace dependencies from lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Require lock-installed release binaries
        shell: bash
        run: |
          set -euo pipefail
          test -x "$VERCEL_BIN"
          test -x "$ESBUILD_BIN"
          "$VERCEL_BIN" --version
          "$ESBUILD_BIN" --version

      - name: Verify production database without migrations
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          node scripts/verify-production-db.mjs

      - name: Bundle production API runtime
        shell: bash
        run: |
          set -euo pipefail
          "$ESBUILD_BIN" api/index.ts \
            --bundle \
            --platform=node \
            --target=node22 \
            --format=esm \
            --external:pg \
            --alias:@yeki-hast/types=./packages/types/src/index.ts \
            --minify \
            --outfile=dist-api/index.mjs
          node --check dist-api/index.mjs
          cat > dist-api/package.json <<'JSON'
          {
            "name": "yeki-hast-api-runtime",
            "private": true,
            "type": "module",
            "dependencies": { "pg": "^8.23.0" },
            "engines": { "node": "22.x" }
          }
          JSON
          cat > dist-api/vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": null,
            "regions": ["iad1"],
            "installCommand": "cd .. && npm ci --ignore-scripts --no-audit --no-fund",
            "rewrites": [
              { "source": "/health", "destination": "/api/index" },
              { "source": "/ready", "destination": "/api/index" },
              { "source": "/v1/:path*", "destination": "/api/index" }
            ]
          }
          JSON
          mkdir -p dist-api/api dist-api/.vercel
          mv dist-api/index.mjs dist-api/api/index.mjs
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$VERCEL_PROJECT_ID" > dist-api/.vercel/project.json
          sha256sum dist-api/api/index.mjs

      - name: Capture current API production deployment for rollback
        id: previous_api
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const token = process.env.VERCEL_TOKEN?.trim();
          const teamId = process.env.VERCEL_TEAM_ID?.trim();
          const projectId = process.env.VERCEL_PROJECT_ID?.trim();
          const output = process.env.GITHUB_OUTPUT;
          if (!token || !teamId || !projectId || !output) throw new Error('rollback capture environment is incomplete');
          const url = new URL('https://api.vercel.com/v6/deployments');
          url.searchParams.set('projectId', projectId);
          url.searchParams.set('target', 'production');
          url.searchParams.set('state', 'READY');
          url.searchParams.set('limit', '1');
          url.searchParams.set('teamId', teamId);
          const response = await fetch(url, { headers: { authorization: `Bearer ${token}` } });
          if (!response.ok) throw new Error(`unable to capture previous production deployment (${response.status})`);
          const body = await response.json();
          const deployment = Array.isArray(body?.deployments) ? body.deployments[0] : null;
          const deploymentId = deployment?.uid || deployment?.id;
          if (typeof deploymentId !== 'string' || !/^dpl_[A-Za-z0-9]+$/.test(deploymentId)) {
            throw new Error('no valid previous production deployment available for rollback');
          }
          appendFileSync(output, `deployment_id=${deploymentId}\n`);
          console.log('previous production deployment captured for rollback');
          NODE

      - name: Sync exact API production environment to UNIQUE
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-vercel-production-env.mjs

      - name: Pull API production settings
        working-directory: dist-api
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" pull --yes --environment=production --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"

      - name: Build API production artifact from locked workspace
        working-directory: dist-api
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" build --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          test -f .vercel/output/config.json

      - name: Deploy prebuilt API artifact to UNIQUE production
        id: deploy_api
        working-directory: dist-api
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"

      - name: Verify production health readiness and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.API_PRODUCTION_URL;
          const expectedSha = process.env.GITHUB_SHA?.toLowerCase();
          if (!expectedSha || !/^[0-9a-f]{40}$/.test(expectedSha)) throw new Error('GITHUB_SHA is invalid');
          const expectedLegal = {
            privacyPolicyUrl: process.env.PRODUCTION_PRIVACY_POLICY_URL?.trim() || 'https://web-unique-6ff0.vercel.app/privacy',
            termsOfServiceUrl: process.env.PRODUCTION_TERMS_OF_SERVICE_URL?.trim() || 'https://web-unique-6ff0.vercel.app/terms',
            accountDeletionUrl: process.env.PRODUCTION_ACCOUNT_DELETION_URL?.trim() || 'https://web-unique-6ff0.vercel.app/account/delete',
            supportEmail: 'sales@uniqueholding.com.tr',
          };
          async function waitFor(path, validate) {
            let last = 'no response';
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(`${base}${path}`, { cache: 'no-store' });
                const text = await response.text();
                let body = null;
                try { body = JSON.parse(text); } catch {}
                if (response.ok && validate(body)) return;
                last = `${response.status} ${text.slice(0, 300)}`;
              } catch (error) { last = error instanceof Error ? error.message : String(error); }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error(`${path} failed production smoke test: ${last}`);
          }
          await waitFor('/health', (body) => body?.ok === true && body?.service === 'yeki-hast-api' && body?.releaseSha === expectedSha);
          await waitFor('/ready', (body) => body?.ok === true && body?.database === 'ready' && body?.schema === 'ready');
          await waitFor('/v1/bootstrap', (body) => typeof body?.brandName === 'string' && body?.market?.code === 'ir' && Array.isArray(body?.languages) && body.languages.length > 0 && body?.features?.callerClosedBetaEnabled === false && body?.legal?.ready === true && body?.legal?.privacyPolicyUrl === expectedLegal.privacyPolicyUrl && body?.legal?.termsOfServiceUrl === expectedLegal.termsOfServiceUrl && body?.legal?.accountDeletionUrl === expectedLegal.accountDeletionUrl && body?.legal?.supportEmail === expectedLegal.supportEmail);
          console.log('production API smoke PASS');
          NODE

      - name: Verify production Email OTP delivery session and logout E2E
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-production-email-auth.mjs

      - name: Roll back API production if post-deploy verification fails
        if: ${{ failure() && steps.deploy_api.outcome == 'success' }}
        shell: bash
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous_api.outputs.deployment_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.VERCEL_TOKEN?.trim();
          const teamId = process.env.VERCEL_TEAM_ID?.trim();
          const projectId = process.env.VERCEL_PROJECT_ID?.trim();
          const deploymentId = process.env.PREVIOUS_DEPLOYMENT_ID?.trim();
          if (!token || !teamId || !projectId || !deploymentId) throw new Error('rollback environment is incomplete');
          if (!/^dpl_[A-Za-z0-9]+$/.test(deploymentId)) throw new Error('rollback deployment id is invalid');
          const url = new URL(`https://api.vercel.com/v1/projects/${encodeURIComponent(projectId)}/rollback/${encodeURIComponent(deploymentId)}`);
          url.searchParams.set('teamId', teamId);
          const response = await fetch(url, {
            method: 'POST',
            headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
          });
          if (!response.ok) throw new Error(`production rollback request failed (${response.status})`);
          console.log('production rollback requested to previous verified deployment');
          NODE
