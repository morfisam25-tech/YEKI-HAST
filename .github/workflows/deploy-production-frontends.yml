name: Deploy Production Web and Admin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .launch/production-frontends

permissions:
  contents: read

concurrency:
  group: yeki-hast-production-frontends
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_GmseY3ibD05FWemVhLElL3hI
      VERCEL_TEAM_SLUG: unique-6ff0
      WEB_PROJECT_ID: prj_afhSiMYpsCfIAxuOmotLAWBvTMDg
      ADMIN_PROJECT_ID: prj_l18v3f003ORfiN6hKxYwJbvVPzzC
      WEB_PRODUCTION_URL: https://web-unique-6ff0.vercel.app
      ADMIN_PRODUCTION_URL: https://admin-unique-6ff0.vercel.app
    steps:
      - name: Require main branch and authorized Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys are allowed only from main"
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "morfisam25-tech/YEKI-HAST" ]; then
            echo "::error::Unexpected repository"
            exit 1
          fi
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN repository secret is required"
            exit 1
          fi

      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Require validated workspace dependency lock
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            echo '::error::package-lock.json is required before production frontend deployment'
            exit 1
          fi

      - name: Setup exact Node used by release tooling
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Verify clean workspace install from lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Bind exact UNIQUE projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/.vercel apps/admin/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$WEB_PROJECT_ID" > apps/web/.vercel/project.json
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$ADMIN_PROJECT_ID" > apps/admin/.vercel/project.json

      - name: Deploy Web to UNIQUE production
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.3.0 deploy \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_TEAM_SLUG"

      - name: Verify Web production public surfaces
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.WEB_PRODUCTION_URL;

          async function waitFor(path, validate, label) {
            let last = 'no response';
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(`${base}${path}`, { cache: 'no-store', redirect: 'manual' });
                const text = await response.text();
                if (response.ok && validate(text)) {
                  console.log(`${label} PASS`);
                  return;
                }
                last = `${response.status} ${text.slice(0, 200)}`;
              } catch (error) {
                last = error instanceof Error ? error.message : String(error);
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error(`${label} failed: ${last}`);
          }

          await waitFor('/', (text) => text.includes('یکی هست') && text.includes('ورود با ایمیل'), 'production Web landing smoke');
          await waitFor('/account/delete', (text) => text.includes('حذف حساب') && text.includes('تأیید مالک حساب'), 'production Web account deletion smoke');
          console.log('production Web public smoke PASS');
          NODE

      - name: Deploy Admin to UNIQUE production
        working-directory: apps/admin
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.3.0 deploy \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_TEAM_SLUG"

      - name: Verify protected Admin production shell with authenticated Vercel CLI
        working-directory: apps/admin
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          cleanup() { rm -f "$tmp"; }
          trap cleanup EXIT

          for attempt in $(seq 1 12); do
            if npx --yes vercel@59.3.0 curl / \
              --deployment "$ADMIN_PRODUCTION_URL" \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_TEAM_SLUG" \
              >"$tmp" 2>/dev/null; then
              if grep -Fq 'یکی هست / عملیات' "$tmp" && grep -Fq 'داشبورد' "$tmp"; then
                echo 'production protected Admin smoke PASS'
                exit 0
              fi
            fi
            sleep 5
          done

          echo '::error::Protected Admin production smoke failed'
          exit 1
