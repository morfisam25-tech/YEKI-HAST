name: Deploy Production Web Current

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-PRODUCTION-WEB to confirm manual Web release'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: yeki-hast-production-frontends
  cancel-in-progress: false

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_GmseY3ibD05FWemVhLElL3hI
      VERCEL_TEAM_SLUG: unique-6ff0
      WEB_PROJECT_ID: prj_afhSiMYpsCfIAxuOmotLAWBvTMDg
      WEB_PROJECT_NAME: web
      ADMIN_PROJECT_ID: prj_l18v3f003ORfiN6hKxYwJbvVPzzC
      ADMIN_PROJECT_NAME: admin
      WEB_PRODUCTION_URL: https://web-unique-6ff0.vercel.app
      VERCEL_BIN: ${{ github.workspace }}/node_modules/.bin/vercel

    steps:
      - name: Require authorized main Web release
        shell: bash
        env:
          MANUAL_CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo '::error::Production Web deploys are allowed only from main'; exit 1; }
          test "$GITHUB_REPOSITORY" = "morfisam25-tech/YEKI-HAST" || { echo '::error::Unexpected repository'; exit 1; }
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || { echo '::error::Manual workflow dispatch is required'; exit 1; }
          test "${MANUAL_CONFIRM:-}" = "DEPLOY-PRODUCTION-WEB" || { echo '::error::Exact production confirmation phrase is required'; exit 1; }
          test -n "${VERCEL_TOKEN:-}" || { echo '::error::VERCEL_TOKEN repository secret is required'; exit 1; }

      - name: Checkout exact source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require validated workspace dependency lock
        shell: bash
        run: test -f package-lock.json

      - name: Setup exact Node used by release tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Require successful Foundation QA coverage for this source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/require-green-foundation-qa.mjs

      - name: Install locked workspace and require Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test -x "$VERCEL_BIN"
          "$VERCEL_BIN" --version

      - name: Configure Standard protection for staged Web production URLs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.VERCEL_TOKEN?.trim();
          const teamId = process.env.VERCEL_TEAM_ID?.trim();
          const projectId = process.env.WEB_PROJECT_ID?.trim();
          if (!token || !teamId || !projectId) throw new Error('Web protection environment is incomplete');
          const endpoint = new URL(`https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}`);
          endpoint.searchParams.set('teamId', teamId);
          const response = await fetch(endpoint, {
            method: 'PATCH',
            headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
            body: JSON.stringify({ ssoProtection: { deploymentType: 'prod_deployment_urls_and_all_previews' } }),
          });
          if (!response.ok) throw new Error(`Web Standard protection update failed (${response.status}): ${(await response.text()).slice(0, 400)}`);
          console.log('Web staged Standard protection PASS');
          NODE

      - name: Capture exact current Web canonical deployment for rollback
        id: previous_web
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync } = await import('node:fs');
          const token = process.env.VERCEL_TOKEN?.trim();
          const teamId = process.env.VERCEL_TEAM_ID?.trim();
          const projectId = process.env.WEB_PROJECT_ID?.trim();
          const canonical = process.env.WEB_PRODUCTION_URL?.trim();
          const output = process.env.GITHUB_OUTPUT;
          if (!token || !teamId || !projectId || !canonical || !output) throw new Error('rollback capture environment is incomplete');
          const host = new URL(canonical).host;
          const endpoint = new URL(`https://api.vercel.com/v13/deployments/${encodeURIComponent(host)}`);
          endpoint.searchParams.set('teamId', teamId);
          const response = await fetch(endpoint, { headers: { authorization: `Bearer ${token}` } });
          if (!response.ok) throw new Error(`unable to resolve current Web canonical deployment (${response.status})`);
          const deployment = await response.json();
          const deploymentId = deployment?.uid || deployment?.id;
          if (deployment.projectId !== projectId) throw new Error('current Web canonical deployment project mismatch');
          if (deployment.readyState !== 'READY') throw new Error(`current Web canonical is not READY (${deployment.readyState})`);
          if (typeof deploymentId !== 'string' || !/^dpl_[A-Za-z0-9]+$/.test(deploymentId)) throw new Error('current Web canonical deployment id is invalid');
          appendFileSync(output, `deployment_id=${deploymentId}\n`);
          console.log('current Web canonical deployment captured for rollback');
          NODE

      - name: Bind exact UNIQUE Web project for proven build phase
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel apps/web/.vercel
          mkdir -p apps/web/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$WEB_PROJECT_ID" > apps/web/.vercel/project.json
          test -f apps/web/.vercel/project.json

      - name: Pull Web production settings
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" pull --yes --environment=production --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          test -f .vercel/project.json
          test -f .vercel/.env.production.local

      - name: Build Web production artifact with app-local project context
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" build --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          test -f .vercel/output/config.json

      - name: Switch to proven repo-level monorepo deploy link
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/.vercel/output/config.json
          rm -f apps/web/.vercel/project.json
          rm -rf .vercel
          mkdir -p .vercel
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            remoteName: 'origin',
            projects: [
              { id: process.env.WEB_PROJECT_ID, name: process.env.WEB_PROJECT_NAME, directory: 'apps/web', orgId: process.env.VERCEL_TEAM_ID },
              { id: process.env.ADMIN_PROJECT_ID, name: process.env.ADMIN_PROJECT_NAME, directory: 'apps/admin', orgId: process.env.VERCEL_TEAM_ID },
            ],
          };
          fs.writeFileSync('.vercel/repo.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE
          test -f .vercel/repo.json
          test ! -f apps/web/.vercel/project.json
          test -f apps/web/.vercel/output/config.json
          test -f node_modules/next/dist/compiled/@opentelemetry/api/index.js
          test -f node_modules/react/cjs/react.production.js
          echo 'Web build-to-deploy link phase switch PASS'

      - name: Deploy prebuilt Web as protected staged production
        id: deploy_web
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$("$VERCEL_BIN" deploy --prebuilt --prod --skip-domain --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG")"
          case "$deployment_url" in https://*.vercel.app) ;; *) echo '::error::Vercel did not return a valid Web deployment URL'; exit 1 ;; esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo 'prebuilt Web staged deployment created; exact URL captured'

      - name: Require skip-domain left Web canonical on previous deployment
        shell: bash
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous_web.outputs.deployment_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.VERCEL_TOKEN?.trim();
          const teamId = process.env.VERCEL_TEAM_ID?.trim();
          const previous = process.env.PREVIOUS_DEPLOYMENT_ID?.trim();
          const host = new URL(process.env.WEB_PRODUCTION_URL).host;
          const endpoint = new URL(`https://api.vercel.com/v13/deployments/${encodeURIComponent(host)}`);
          endpoint.searchParams.set('teamId', teamId);
          const response = await fetch(endpoint, { headers: { authorization: `Bearer ${token}` } });
          if (!response.ok) throw new Error(`unable to verify Web canonical after staged deploy (${response.status})`);
          const deployment = await response.json();
          const current = deployment?.uid || deployment?.id;
          if (current !== previous) throw new Error('Web canonical changed before verification despite --skip-domain');
          console.log('Web canonical remained on previous verified deployment after staged deploy');
          NODE

      - name: Require exact staged Web deployment READY and protected
        id: verify_exact
        shell: bash
        env:
          WEB_EXACT_DEPLOYMENT_URL: ${{ steps.deploy_web.outputs.url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync } = await import('node:fs');
          const token = process.env.VERCEL_TOKEN?.trim();
          const teamId = process.env.VERCEL_TEAM_ID?.trim();
          const projectId = process.env.WEB_PROJECT_ID?.trim();
          const rawUrl = process.env.WEB_EXACT_DEPLOYMENT_URL?.trim();
          const output = process.env.GITHUB_OUTPUT;
          if (!token || !teamId || !projectId || !rawUrl || !output) throw new Error('exact Web verification environment is incomplete');
          const host = new URL(rawUrl).host;
          const endpoint = new URL(`https://api.vercel.com/v13/deployments/${encodeURIComponent(host)}`);
          endpoint.searchParams.set('teamId', teamId);
          let deployment;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            const response = await fetch(endpoint, { headers: { authorization: `Bearer ${token}` } });
            if (response.ok) {
              deployment = await response.json();
              if (deployment.projectId === projectId && deployment.readyState === 'READY') break;
            }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!deployment || deployment.projectId !== projectId || deployment.readyState !== 'READY') throw new Error('exact Web deployment is not READY on expected project');
          const deploymentId = deployment.uid || deployment.id;
          if (typeof deploymentId !== 'string' || !/^dpl_[A-Za-z0-9]+$/.test(deploymentId)) throw new Error('exact Web deployment id is invalid');
          appendFileSync(output, `deployment_id=${deploymentId}\n`);

          const unauthenticated = await fetch(rawUrl, { cache: 'no-store', redirect: 'manual' });
          const location = unauthenticated.headers.get('location') || '';
          const protectedResponse = unauthenticated.status === 401
            || unauthenticated.status === 403
            || (unauthenticated.status >= 300 && unauthenticated.status < 400 && (unauthenticated.status === 302 || /vercel\.com|\/_vercel\//i.test(location)));
          if (!protectedResponse) throw new Error(`exact staged Web deployment is not protected (${unauthenticated.status})`);
          console.log(`exact staged Web deployment identity/READY/protection PASS (${unauthenticated.status})`);
          NODE

      - name: Authenticated smoke exact staged Web deployment
        working-directory: apps/web
        env:
          WEB_EXACT_DEPLOYMENT_URL: ${{ steps.deploy_web.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          check_path() {
            local path="$1" needle="$2" tmp
            tmp="$(mktemp)"
            "$VERCEL_BIN" curl "$path" \
              --deployment "$WEB_EXACT_DEPLOYMENT_URL" \
              --yes \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_TEAM_SLUG" \
              >"$tmp"
            grep -Fq "$needle" "$tmp"
            rm -f "$tmp"
          }
          check_path / 'ورود با ایمیل'
          check_path / 'mailto:sales@uniqueholding.com.tr'
          check_path /privacy 'Web و اپ موبایل'
          check_path /terms 'قوانین استفاده'
          check_path /account/delete 'تأیید مالک حساب'
          check_path /account/delete 'حذف واقعی حساب'
          echo 'exact protected Web pre-cutover smoke PASS'

      - name: Promote only verified Web deployment
        id: promote_web
        working-directory: apps/web
        env:
          WEB_EXACT_DEPLOYMENT_URL: ${{ steps.deploy_web.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" promote "$WEB_EXACT_DEPLOYMENT_URL" --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          echo 'verified Web staged deployment promoted'

      - name: Verify public Web canonical points to promoted release and required surfaces
        shell: bash
        env:
          EXPECTED_DEPLOYMENT_ID: ${{ steps.verify_exact.outputs.deployment_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.VERCEL_TOKEN?.trim();
          const teamId = process.env.VERCEL_TEAM_ID?.trim();
          const expectedDeploymentId = process.env.EXPECTED_DEPLOYMENT_ID?.trim();
          const base = process.env.WEB_PRODUCTION_URL;
          if (!expectedDeploymentId) throw new Error('promoted deployment id is missing');

          let canonicalOk = false;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            const host = new URL(base).host;
            const endpoint = new URL(`https://api.vercel.com/v13/deployments/${encodeURIComponent(host)}`);
            endpoint.searchParams.set('teamId', teamId);
            const response = await fetch(endpoint, { headers: { authorization: `Bearer ${token}` } });
            if (response.ok) {
              const deployment = await response.json();
              const current = deployment?.uid || deployment?.id;
              if (current === expectedDeploymentId && deployment.readyState === 'READY') { canonicalOk = true; break; }
            }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!canonicalOk) throw new Error('Web canonical did not resolve to the promoted verified deployment');

          async function waitFor(path, needles, label) {
            let last = 'no response';
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(`${base}${path}`, { cache: 'no-store', redirect: 'manual' });
                const text = await response.text();
                if (response.ok && needles.every((needle) => text.includes(needle))) { console.log(`${label} PASS`); return; }
                last = `${response.status} ${text.slice(0, 160)}`;
              } catch (error) { last = error instanceof Error ? error.message : String(error); }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error(`${label} failed: ${last}`);
          }
          await waitFor('/', ['یکی هست', 'ورود با ایمیل', 'mailto:sales@uniqueholding.com.tr'], 'Web landing');
          await waitFor('/privacy', ['حریم خصوصی', 'Web و اپ موبایل', 'حذف حساب'], 'Web privacy');
          await waitFor('/terms', ['قوانین استفاده', 'ماهیت سرویس'], 'Web terms');
          await waitFor('/account/delete', ['حذف حساب', 'تأیید مالک حساب', 'حذف واقعی حساب'], 'Web account deletion');
          console.log('production Web canonical verification PASS');
          NODE

      - name: Restore previous Web canonical deployment if any post-deploy verification fails
        if: ${{ failure() && steps.deploy_web.outcome == 'success' }}
        shell: bash
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous_web.outputs.deployment_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.VERCEL_TOKEN?.trim();
          const teamId = process.env.VERCEL_TEAM_ID?.trim();
          const projectId = process.env.WEB_PROJECT_ID?.trim();
          const deploymentId = process.env.PREVIOUS_DEPLOYMENT_ID?.trim();
          if (!token || !teamId || !projectId || !deploymentId) throw new Error('Web rollback environment is incomplete');
          if (!/^dpl_[A-Za-z0-9]+$/.test(deploymentId)) throw new Error('Web rollback deployment id is invalid');
          const endpoint = new URL(`https://api.vercel.com/v1/projects/${encodeURIComponent(projectId)}/rollback/${encodeURIComponent(deploymentId)}`);
          endpoint.searchParams.set('teamId', teamId);
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
          });
          if (!response.ok) throw new Error(`Web rollback request failed (${response.status})`);
          console.log('previous verified Web canonical deployment restored');
          NODE
