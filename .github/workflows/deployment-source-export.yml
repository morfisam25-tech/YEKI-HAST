name: Deployment Source Export

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Upload deployment source
        uses: actions/upload-artifact@v4
        with:
          name: listener-deployment-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
