name: Fix v1.2 no-answer ledger idempotency

on:
  push:
    branches: [feat/v1-2-internet-voice-foundation]
    paths:
      - .github/workflows/fix-v12-no-answer-ledger.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v1-2-internet-voice-foundation

      - name: Canonicalize no-answer HOLD release key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          old_hash = '5a2943f0cf6238776b607836b3b3bbf0b464ba0548e80373db781ce1a7c9359d'

          migration = Path('packages/db/migrations/0003_internet_voice_transport.sql')
          text = migration.read_text()
          old_key = "'call:' || NEW.id::text || ':hold:no_answer_release'"
          new_key = "'call:' || NEW.id::text || ':hold:release:no_answer'"
          if text.count(old_key) != 1:
              raise SystemExit('expected exactly one legacy no-answer HOLD key')
          migration.write_text(text.replace(old_key, new_key, 1))
          new_hash = hashlib.sha256(migration.read_bytes()).hexdigest()
          if new_hash != '08fc87e2b1a12164b3078b99ca66b46d6db6003fb387fa79761bba92c34bff12':
              raise SystemExit(f'unexpected 0003 hash: {new_hash}')

          for rel in [
              'api/index.ts',
              'scripts/preflight-production-db-migration.mjs',
              'scripts/verify-production-db.mjs',
          ]:
              path = Path(rel)
              source = path.read_text()
              if old_hash not in source:
                  raise SystemExit(f'old 0003 hash missing from {rel}')
              path.write_text(source.replace(old_hash, new_hash))

          test_path = Path('tests/internet-voice-server-sweeper.test.ts')
          source = test_path.read_text()
          marker = "test('no-answer HOLD release uses one canonical idempotency key across API, trigger and sweeper'"
          if marker not in source:
              source += """

          test('no-answer HOLD release uses one canonical idempotency key across API, trigger and sweeper', async () => {
            const voiceRoute = await readFile(new URL('../services/api/src/routes/internet-voice.ts', import.meta.url), 'utf8');
            assert.match(transportMigration, /:hold:release:no_answer/);
            assert.match(migration, /:hold:release:no_answer/);
            assert.match(voiceRoute, /:hold:release:no_answer/);
            assert.doesNotMatch(transportMigration, /:hold:no_answer_release/);
            assert.equal((transportMigration.match(/:hold:release:no_answer/g) ?? []).length, 1);
            assert.ok((migration.match(/:hold:release:no_answer/g) ?? []).length >= 1);
            assert.ok((voiceRoute.match(/:hold:release:no_answer/g) ?? []).length >= 1);
          });
          """
              test_path.write_text(source)
          PY

          node --experimental-strip-types --test \
            tests/internet-voice-server-sweeper.test.ts \
            tests/booking-v12-guard.test.ts
          git diff --check

      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git add \
            packages/db/migrations/0003_internet_voice_transport.sql \
            api/index.ts \
            scripts/preflight-production-db-migration.mjs \
            scripts/verify-production-db.mjs \
            tests/internet-voice-server-sweeper.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: deduplicate no-answer HOLD release ledger'
          git push origin HEAD:feat/v1-2-internet-voice-foundation
