name: Apply v1.2 typecheck fixes

on:
  push:
    branches: [feat/v1-2-internet-voice-foundation]
    paths:
      - .github/workflows/fix-v12-typecheck.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v1-2-internet-voice-foundation
      - name: Patch exact TypeScript failures
        shell: python
        run: |
          from pathlib import Path

          def once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              p.write_text(s.replace(old, new, 1))

          once(
            'apps/mobile/src/CallerClosedBetaScreen.tsx',
            'peer.onicecandidate = (event) => {',
            'peer.onicecandidate = (event: { candidate: RTCIceCandidate | null }) => {',
            'caller ICE event type',
          )
          once(
            'apps/mobile/src/CallerClosedBetaScreen.tsx',
            "      const started = await startInternetVoiceCall(token, requested.callId);\n      voiceStarted = true;\n      setCall((current) => current?.callId === requested?.callId ? {\n        ...current,\n        status: started.status,\n        transport: 'internet_voice',\n      } : current);\n      setNoAnswerDeadlineMs(Date.now() + started.noAnswerSeconds * 1_000);\n      await createCallerPeer(requested.callId, started.client, stream);",
            "      const startedCallId = requested.callId;\n      const started = await startInternetVoiceCall(token, startedCallId);\n      voiceStarted = true;\n      setCall((current) => current && current.callId === startedCallId ? {\n        ...current,\n        status: started.status,\n        transport: 'internet_voice',\n      } : current);\n      setNoAnswerDeadlineMs(Date.now() + started.noAnswerSeconds * 1_000);\n      await createCallerPeer(startedCallId, started.client, stream);",
            'caller state merge',
          )
          once(
            'apps/mobile/src/ListenerActiveCallCard.tsx',
            'peer.onicecandidate = (event) => {',
            'peer.onicecandidate = (event: { candidate: RTCIceCandidate | null }) => {',
            'listener ICE event type',
          )
          once(
            'apps/web/app/talk/page.tsx',
            "Number(value / 10n)",
            "Number(value / BigInt(10))",
            'web BigInt target compatibility',
          )

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git add apps/mobile/src/CallerClosedBetaScreen.tsx apps/mobile/src/ListenerActiveCallCard.tsx apps/web/app/talk/page.tsx
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: resolve v1.2 mobile and web typecheck errors'
          git push origin HEAD:feat/v1-2-internet-voice-foundation
