name: Foundation QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Runtime syntax checks
        run: |
          node --experimental-strip-types --check api/index.ts
          node --experimental-strip-types --check api/runtime.ts
          node --experimental-strip-types --check apps/mobile/src/api.ts
          node --experimental-strip-types --check services/api/src/providers/sms.ts
          node --experimental-strip-types --check services/api/src/providers/payment.ts
          node --experimental-strip-types --check services/api/src/providers/payout.ts
          node --experimental-strip-types --check services/api/src/providers/telephony.ts
          node --experimental-strip-types --check services/api/src/routes/auth.ts
          node --experimental-strip-types --check services/api/src/routes/payments.ts
          node --experimental-strip-types --check services/api/src/routes/listener.ts
          node --experimental-strip-types --check services/api/src/routes/kyc.ts
          node --experimental-strip-types --check services/api/src/routes/marketplace.ts
          node --experimental-strip-types --check services/api/src/routes/calls.ts
          node --experimental-strip-types --check services/api/src/routes/call-dispatch.ts
          node --experimental-strip-types --check services/api/src/services/call-lifecycle.ts
          node --experimental-strip-types --check services/api/src/routes/safety.ts
          node --experimental-strip-types --check services/api/src/routes/admin.ts
          node --experimental-strip-types --check services/api/src/routes/admin-kyc.ts
          node --experimental-strip-types --check services/api/src/routes/admin-payouts.ts
          node --experimental-strip-types --check services/api/src/routes/admin-payments.ts
          node --experimental-strip-types --check services/api/src/routes/admin-waitlist.ts
          node --experimental-strip-types --check services/api/src/routes/admin-readiness.ts
          node --experimental-strip-types --check services/api/src/routes/admin-safety.ts
          node --experimental-strip-types --check services/api/src/routes/admin-calls.ts
          node --experimental-strip-types --check services/api/src/routes/payouts.ts
          node --experimental-strip-types --check services/api/src/lib/admin.ts
          node --experimental-strip-types --check services/api/src/lib/security.ts
          node --experimental-strip-types --check services/api/src/domain/iran-identifiers.ts
          node --experimental-strip-types --check services/api/src/domain/persian-calendar.ts
          node --experimental-strip-types --check services/api/src/domain/listener-onboarding.ts
          node --experimental-strip-types --check services/api/src/domain/call-authorization.ts
          node --experimental-strip-types --check services/api/src/domain/payment-status.ts
          node --experimental-strip-types --check services/api/src/handler.ts

      - name: Foundation tests
        run: npm test

      - name: Foundation invariant validator
        run: npm run validate:foundation

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck all workspaces
        run: npm run typecheck
