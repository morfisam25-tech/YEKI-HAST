name: Foundation QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - .launch/**
      - docs/**
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ESBUILD_BIN: ${{ github.workspace }}/node_modules/.bin/esbuild
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require validated workspace dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json || { echo '::error::package-lock.json is required before Foundation QA'; exit 1; }

      - name: Setup exact Node used by release tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install workspace dependencies from lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Require lock-installed API bundler
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ESBUILD_BIN"
          "$ESBUILD_BIN" --version

      - name: Runtime syntax checks
        run: |
          node --experimental-strip-types --check api/index.ts
          node --experimental-strip-types --check api/runtime.ts
          node --experimental-strip-types --check apps/mobile/src/api.ts
          node --experimental-strip-types --check apps/mobile/src/email-auth-api.ts
          node --experimental-strip-types --check apps/mobile/src/call-phone-api.ts
          node --experimental-strip-types --check services/api/src/providers/sms.ts
          node --experimental-strip-types --check services/api/src/providers/email.ts
          node --experimental-strip-types --check services/api/src/providers/payment.ts
          node --experimental-strip-types --check services/api/src/providers/payout.ts
          node --experimental-strip-types --check services/api/src/providers/telephony.ts
          node --experimental-strip-types --check services/api/src/routes/auth.ts
          node --experimental-strip-types --check services/api/src/routes/auth-email.ts
          node --experimental-strip-types --check services/api/src/routes/account-contact.ts
          node --experimental-strip-types --check services/api/src/routes/account-deletion.ts
          node --experimental-strip-types --check services/api/src/routes/admin-account-deletion.ts
          node --experimental-strip-types --check services/api/src/routes/admin-contact.ts
          node --experimental-strip-types --check services/api/src/routes/payments.ts
          node --experimental-strip-types --check services/api/src/routes/listener.ts
          node --experimental-strip-types --check services/api/src/routes/kyc.ts
          node --experimental-strip-types --check services/api/src/routes/marketplace.ts
          node --experimental-strip-types --check services/api/src/routes/calls.ts
          node --experimental-strip-types --check services/api/src/routes/call-dispatch.ts
          node --experimental-strip-types --check services/api/src/services/call-lifecycle.ts
          node --experimental-strip-types --check services/api/src/routes/safety.ts
          node --experimental-strip-types --check services/api/src/routes/admin.ts
          node --experimental-strip-types --check services/api/src/routes/admin-kyc.ts
          node --experimental-strip-types --check services/api/src/routes/admin-payouts.ts
          node --experimental-strip-types --check services/api/src/routes/admin-payments.ts
          node --experimental-strip-types --check services/api/src/routes/admin-waitlist.ts
          node --experimental-strip-types --check services/api/src/routes/admin-readiness.ts
          node --experimental-strip-types --check services/api/src/routes/admin-safety.ts
          node --experimental-strip-types --check services/api/src/routes/admin-calls.ts
          node --experimental-strip-types --check services/api/src/routes/payouts.ts
          node --experimental-strip-types --check services/api/src/lib/admin.ts
          node --experimental-strip-types --check services/api/src/lib/admin-bootstrap.ts
          node --experimental-strip-types --check services/api/src/lib/call-phone.ts
          node --experimental-strip-types --check services/api/src/lib/security.ts
          node --experimental-strip-types --check services/api/src/domain/iran-identifiers.ts
          node --experimental-strip-types --check services/api/src/domain/persian-calendar.ts
          node --experimental-strip-types --check services/api/src/domain/listener-onboarding.ts
          node --experimental-strip-types --check services/api/src/domain/call-authorization.ts
          node --experimental-strip-types --check services/api/src/domain/payment-status.ts
          node --experimental-strip-types --check services/api/src/handler.ts
          node --check scripts/preflight-production-db-migration.mjs
          node --check scripts/verify-production-security-config.mjs
          node --check scripts/verify-production-db.mjs
          node --check scripts/sync-vercel-production-env.mjs
          node --check scripts/smoke-production-email-auth.mjs
          node --check scripts/require-green-foundation-qa.mjs

      - name: Foundation tests
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee foundation-test.log; then
            {
              echo '### Foundation test failure'
              echo '```text'
              tail -n 120 foundation-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Foundation invariant validator
        run: npm run validate:foundation

      - name: Email-first production security verifier
        env:
          NODE_ENV: production
          DEV_EXPOSE_OTP: 'false'
          PHONE_HASH_PEPPER: ci-phone-pepper-0000000000000000000000000000
          EMAIL_HASH_PEPPER: ci-email-pepper-0000000000000000000000000000
          IP_HASH_PEPPER: ci-ip-pepper-000000000000000000000000000000
          OTP_HASH_PEPPER: ci-otp-pepper-0000000000000000000000000000
          KYC_HASH_PEPPER: ci-kyc-pepper-0000000000000000000000000000
          ACTIVE_DATA_ENCRYPTION_KEY_ID: k1
          DATA_ENCRYPTION_KEYS: '{"k1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
          EMAIL_PROVIDER: gmail_api
          GMAIL_SERVICE_ACCOUNT_JSON: '{"type":"service_account","client_email":"foundation-qa@example.iam.gserviceaccount.com","private_key":"-----BEGIN PRIVATE KEY-----\nci-only-placeholder-not-a-credential\n-----END PRIVATE KEY-----\n","token_uri":"https://oauth2.googleapis.com/token"}'
          GMAIL_IMPERSONATED_USER: sales@uniqueholding.com.tr
          GMAIL_FROM_EMAIL: sales@uniqueholding.com.tr
          GMAIL_FROM_NAME: Yeki Hast
        run: npm run verify:security-config

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build Web production app
        env:
          NODE_ENV: production
        run: npm --workspace @yeki-hast/web run build

      - name: Build Admin production app
        env:
          NODE_ENV: production
        run: npm --workspace @yeki-hast/admin run build

      - name: Export Android bundle
        env:
          EXPO_PUBLIC_API_BASE_URL: https://yeki-hast-unique-6ff0.vercel.app
        run: npm --workspace @yeki-hast/mobile run export:android

      - name: Export iOS bundle
        env:
          EXPO_PUBLIC_API_BASE_URL: https://yeki-hast-unique-6ff0.vercel.app
        run: npm --workspace @yeki-hast/mobile run export:ios

      - name: Bundle production API runtime
        run: |
          "$ESBUILD_BIN" api/index.ts \
            --bundle \
            --platform=node \
            --target=node22 \
            --format=esm \
            --external:pg \
            --alias:@yeki-hast/types=./packages/types/src/index.ts \
            --minify \
            --outfile=dist-api/index.mjs
          node --check dist-api/index.mjs
          cat > dist-api/package.json <<'JSON'
          {
            "name": "yeki-hast-api-runtime",
            "private": true,
            "type": "module",
            "dependencies": { "pg": "^8.23.0" },
            "engines": { "node": "22.x" }
          }
          JSON
          cat > dist-api/vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": null,
            "regions": ["iad1"],
            "rewrites": [
              { "source": "/health", "destination": "/api/index" },
              { "source": "/ready", "destination": "/api/index" },
              { "source": "/v1/:path*", "destination": "/api/index" }
            ]
          }
          JSON
          mkdir -p dist-api/api
          mv dist-api/index.mjs dist-api/api/index.mjs

      - name: Upload production API artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yeki-hast-api-bundle
          path: dist-api
          retention-days: 1
