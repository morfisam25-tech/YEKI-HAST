name: Generate Dependency Lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .launch/dependency-lock

permissions:
  contents: write
  actions: write

concurrency:
  group: yeki-hast-dependency-lock
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main HEAD
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup exact Node used by release tooling
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Generate npm lock from committed workspace manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify the generated lock can drive a clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Preserve validated lock as fallback artifact
        uses: actions/upload-artifact@v4
        with:
          name: yeki-hast-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit validated lock to main
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo 'package-lock.json is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock workspace dependencies'
          git push origin HEAD:main

      - name: Dispatch Foundation QA on current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run foundation-qa.yml --ref main
          echo 'Foundation QA dispatch requested for current main'
