name: Launch Capability Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_NEON_API_KEY: ${{ secrets.NEON_API_KEY != '' }}
      HAS_SMTP_HOST: ${{ secrets.SMTP_HOST != '' }}
      HAS_SMTP_PORT: ${{ secrets.SMTP_PORT != '' }}
      HAS_SMTP_USERNAME: ${{ secrets.SMTP_USERNAME != '' }}
      HAS_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD != '' }}
      HAS_SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL != '' }}
      HAS_DATA_ENCRYPTION_KEYS: ${{ secrets.DATA_ENCRYPTION_KEYS != '' }}
      HAS_EMAIL_HASH_PEPPER: ${{ secrets.EMAIL_HASH_PEPPER != '' }}
      HAS_IP_HASH_PEPPER: ${{ secrets.IP_HASH_PEPPER != '' }}
      HAS_OTP_HASH_PEPPER: ${{ secrets.OTP_HASH_PEPPER != '' }}
      HAS_PHONE_HASH_PEPPER: ${{ secrets.PHONE_HASH_PEPPER != '' }}
      HAS_KYC_HASH_PEPPER: ${{ secrets.KYC_HASH_PEPPER != '' }}
      HAS_NEXTPAY_API_KEY: ${{ secrets.NEXTPAY_API_KEY != '' }}
      HAS_NEXTPAY_INQUIRY_API: ${{ secrets.NEXTPAY_INQUIRY_API != '' }}
      HAS_NEXTPAY_PAYOUT_WID: ${{ secrets.NEXTPAY_PAYOUT_WID != '' }}
      HAS_NEXTPAY_PAYOUT_AUTH: ${{ secrets.NEXTPAY_PAYOUT_AUTH != '' }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            HAS_DATABASE_URL HAS_VERCEL_TOKEN HAS_NEON_API_KEY \
            HAS_SMTP_HOST HAS_SMTP_PORT HAS_SMTP_USERNAME HAS_SMTP_PASSWORD HAS_SMTP_FROM_EMAIL \
            HAS_DATA_ENCRYPTION_KEYS HAS_EMAIL_HASH_PEPPER HAS_IP_HASH_PEPPER HAS_OTP_HASH_PEPPER \
            HAS_PHONE_HASH_PEPPER HAS_KYC_HASH_PEPPER \
            HAS_NEXTPAY_API_KEY HAS_NEXTPAY_INQUIRY_API HAS_NEXTPAY_PAYOUT_WID HAS_NEXTPAY_PAYOUT_AUTH
          do
            printf '%s=%s\n' "$name" "${!name}"
          done

      - name: Verify Vercel token scope without exposing values
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node <<'NODE'
          const teamId = 'team_GmseY3ibD05FWemVhLElL3hI';
          const projects = [
            ['api', 'prj_ijhc8kDsH24eQK5TfhFOqW8RVSxy'],
            ['web', 'prj_afhSiMYpsCfIAxuOmotLAWBvTMDg'],
            ['admin', 'prj_l18v3f003ORfiN6hKxYwJbvVPzzC'],
          ];
          const headers = { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` };
          for (const [label, id] of projects) {
            const projectRes = await fetch(`https://api.vercel.com/v9/projects/${id}?teamId=${teamId}`, { headers });
            if (!projectRes.ok) throw new Error(`vercel_project_${label}_${projectRes.status}`);
            const project = await projectRes.json();
            console.log(`VERCEL_PROJECT_${label.toUpperCase()}=${project.name}`);

            const envRes = await fetch(`https://api.vercel.com/v9/projects/${id}/env?teamId=${teamId}`, { headers });
            if (!envRes.ok) throw new Error(`vercel_env_${label}_${envRes.status}`);
            const body = await envRes.json();
            const envs = Array.isArray(body.envs) ? body.envs : [];
            const safe = envs.map((x) => ({ key: x.key, target: x.target, type: x.type })).sort((a, b) => a.key.localeCompare(b.key));
            console.log(`VERCEL_ENV_KEYS_${label.toUpperCase()}=${JSON.stringify(safe)}`);
          }
          NODE

      - name: Verify Neon API key scope without exposing credentials
        if: ${{ secrets.NEON_API_KEY != '' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          node <<'NODE'
          const projectId = 'calm-sun-22159730';
          const res = await fetch(`https://console.neon.tech/api/v2/projects/${projectId}`, {
            headers: { Authorization: `Bearer ${process.env.NEON_API_KEY}` },
          });
          if (!res.ok) throw new Error(`neon_project_${res.status}`);
          const body = await res.json();
          console.log(`NEON_PROJECT=${body?.project?.id ?? 'unknown'}:${body?.project?.name ?? 'unknown'}`);
          NODE
