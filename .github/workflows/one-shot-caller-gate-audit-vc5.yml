name: One-shot caller gate audit vc5

on:
  push:
    branches:
      - ops/turn-provider-audit-vc5

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/turn-provider-audit-vc5
          fetch-depth: 1

      - name: Self-remove audit workflow first
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-caller-gate-audit-vc5.yml
          git commit -m 'ops: remove one-shot caller gate audit workflow'
          git push origin HEAD:ops/turn-provider-audit-vc5

      - name: Inspect only non-secret production gate values
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_ijhc8kDsH24eQK5TfhFOqW8RVSxy
          TEAM_ID: team_GmseY3ibD05FWemVhLElL3hI
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?teamId=${TEAM_ID}&decrypt=true" \
            > "$response_file"

          RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.env.RESPONSE_FILE, 'utf8'));
          const envs = Array.isArray(body.envs) ? body.envs : [];
          const byKey = new Map();
          for (const e of envs) {
            if (!e || typeof e.key !== 'string') continue;
            if (Array.isArray(e.target) && e.target.includes('production')) byKey.set(e.key, e);
          }
          const text = (key) => byKey.has(key) ? String(byKey.get(key).value ?? '').trim() : null;
          const bool = (key) => {
            const v = text(key);
            if (v === null || v === '') return 'unset';
            if (/^true$/i.test(v)) return true;
            if (/^false$/i.test(v)) return false;
            return 'invalid';
          };
          const enumValue = (key, allowed) => {
            const v = text(key);
            if (v === null || v === '') return 'unset';
            return allowed.includes(v) ? v : 'other';
          };
          const presence = (key) => {
            const v = text(key);
            return v !== null && v.length > 0;
          };

          const report = {
            nodeEnv: enumValue('NODE_ENV', ['production','preview','development','test']),
            callerClosedBetaEnabled: bool('CALLER_CLOSED_BETA_ENABLED'),
            commercialHostingApproved: bool('COMMERCIAL_HOSTING_APPROVED'),
            primaryTransport: enumValue('CALL_PRIMARY_TRANSPORT', ['internet_voice','masked_pstn']),
            fallbackTransport: enumValue('CALL_FALLBACK_TRANSPORT', ['none','internet_voice','masked_pstn']),
            turnIceConfigured: presence('INTERNET_VOICE_ICE_SERVERS_JSON'),
            iranTurnConfigured: presence('INTERNET_VOICE_IRAN_ICE_SERVERS_JSON'),
            iranControlPlaneConfigured: presence('INTERNET_VOICE_IRAN_CONTROL_PLANE_BASE_URL'),
            manualPhoneVerificationBetaEnabled: bool('MANUAL_PHONE_VERIFICATION_BETA_ENABLED'),
            callerMinimumAgeConfigured: presence('CALLER_MINIMUM_AGE'),
            callerAgePolicyVersionConfigured: presence('CALLER_AGE_POLICY_VERSION'),
            paymentProviderConfigured: presence('PAYMENT_PROVIDER'),
            kycProviderConfigured: presence('KYC_INQUIRY_PROVIDER'),
            payoutProviderConfigured: presence('PAYOUT_PROVIDER'),
          };
          const callerGateOperational = report.callerClosedBetaEnabled === true &&
            report.commercialHostingApproved === true &&
            report.turnIceConfigured === true;
          report.callerInternetVoiceOperational = callerGateOperational;

          const output = JSON.stringify(report, null, 2);
          console.log(output);
          fs.writeFileSync('caller-gate-audit-safe.json', output + '\n');
          NODE

      - name: Upload redacted gate report
        uses: actions/upload-artifact@v4
        with:
          name: caller-gate-audit-safe-vc5
          path: caller-gate-audit-safe.json
          retention-days: 30
          if-no-files-found: error
