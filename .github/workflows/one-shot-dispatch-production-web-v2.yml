name: One-shot dispatch Production Web V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-dispatch-production-web-v2.yml

permissions:
  contents: write
  actions: write

env:
  BASELINE_SHA: 94b7ea2bd25cc9c18c0a4dc977e50d35be3a6ac2
  CONTROLLER_PATH: .github/workflows/one-shot-dispatch-production-web-v2.yml
  TARGET_WORKFLOW: deploy-production-web-v2.yml

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact controller commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require exact green application baseline
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "morfisam25-tech/YEKI-HAST"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^)" = "$BASELINE_SHA"
          GITHUB_SHA="$BASELINE_SHA" node scripts/require-green-foundation-qa.mjs

      - name: Self-remove and restore exact application tree
        shell: bash
        run: |
          set -euo pipefail
          rm "$CONTROLLER_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CONTROLLER_PATH"
          git commit -m "chore: remove one-shot Web v1.2 release dispatcher"
          RELEASE_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse "$BASELINE_SHA^{tree}")" = "$(git rev-parse HEAD^{tree})"
          git push origin HEAD:main
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Dispatch existing guarded Production Web V2 workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$RELEASE_SHA"
          payload='{"ref":"main","inputs":{"confirm":"DEPLOY-PRODUCTION-WEB-V2"}}'
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches"
          echo "Guarded Production Web V2 dispatch accepted for $RELEASE_SHA"
