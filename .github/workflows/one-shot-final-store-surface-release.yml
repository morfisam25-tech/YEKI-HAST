name: One-shot final Store surface release

on:
  push:
    branches:
      - ops/final-store-surface-release-20260907

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_MAIN_SHA: c0d6bea2c1391fd8a07c6ce1c4b4f183f3c0e17f
      MAIN_QA_RUN_ID: '34163584280'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/final-store-surface-release-20260907
          fetch-depth: 1

      - name: Self-remove controller before any production action
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-final-store-surface-release.yml
          git commit -m 'ops: remove one-shot final Store surface controller'
          git push origin HEAD:ops/final-store-surface-release-20260907

      - name: Require exact main and successful Foundation QA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const expected = process.env.EXPECTED_MAIN_SHA;
          const runId = process.env.MAIN_QA_RUN_ID;
          const headers = { authorization: `Bearer ${token}`, accept: 'application/vnd.github+json', 'x-github-api-version': '2022-11-28' };
          async function json(url) {
            const r = await fetch(url, { headers });
            if (!r.ok) throw new Error(`GitHub GET failed ${r.status}`);
            return r.json();
          }
          const branch = await json(`https://api.github.com/repos/${repo}/branches/main`);
          if (branch?.commit?.sha !== expected) throw new Error(`main moved: ${branch?.commit?.sha ?? 'unknown'}`);
          for (let i = 0; i < 180; i += 1) {
            const run = await json(`https://api.github.com/repos/${repo}/actions/runs/${runId}`);
            if (run?.head_sha !== expected || run?.path !== '.github/workflows/foundation-qa.yml' || run?.head_branch !== 'main') {
              throw new Error('Foundation QA identity mismatch');
            }
            if (run?.status === 'completed') {
              if (run?.conclusion !== 'success') throw new Error(`Foundation QA concluded ${run?.conclusion}`);
              console.log(`exact main Foundation QA PASS (${run.id})`);
              process.exit(0);
            }
            await new Promise(r => setTimeout(r, 5000));
          }
          throw new Error('Foundation QA did not complete inside controller guard window');
          NODE

      - name: Dispatch and verify Web V2 production release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const expected = process.env.EXPECTED_MAIN_SHA;
          const workflow = 'deploy-production-web-v2.yml';
          const headers = { authorization: `Bearer ${token}`, accept: 'application/vnd.github+json', 'content-type': 'application/json', 'x-github-api-version': '2022-11-28' };
          async function getRuns() {
            const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/runs?branch=main&event=workflow_dispatch&per_page=30`, { headers });
            if (!r.ok) throw new Error(`list Web runs failed ${r.status}`);
            return (await r.json()).workflow_runs ?? [];
          }
          const before = new Set((await getRuns()).map(x => x.id));
          const dispatch = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/dispatches`, {
            method: 'POST', headers, body: JSON.stringify({ ref: 'main', inputs: { confirm: 'DEPLOY-PRODUCTION-WEB-V2' } }),
          });
          if (dispatch.status !== 204) throw new Error(`Web dispatch failed ${dispatch.status}: ${(await dispatch.text()).slice(0, 300)}`);
          let target = null;
          for (let i = 0; i < 60 && !target; i += 1) {
            const runs = await getRuns();
            target = runs.find(x => !before.has(x.id) && x.head_sha === expected && x.head_branch === 'main') ?? null;
            if (!target) await new Promise(r => setTimeout(r, 3000));
          }
          if (!target) throw new Error('Web release run was not found after dispatch');
          console.log(`Web release run ${target.id}`);
          for (let i = 0; i < 300; i += 1) {
            const r = await fetch(`https://api.github.com/repos/${repo}/actions/runs/${target.id}`, { headers });
            if (!r.ok) throw new Error(`Web run read failed ${r.status}`);
            const run = await r.json();
            if (run.status === 'completed') {
              if (run.conclusion !== 'success') throw new Error(`Web production release concluded ${run.conclusion}`);
              console.log('guarded Web production release PASS');
              process.exit(0);
            }
            await new Promise(r => setTimeout(r, 5000));
          }
          throw new Error('Web production release did not complete in guard window');
          NODE

      - name: Verify corrected public Privacy before API cutover
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = 'https://yekihast.app/privacy';
          let last = '';
          for (let i = 0; i < 20; i += 1) {
            const r = await fetch(url, { cache: 'no-store' });
            const text = await r.text();
            last = `${r.status} ${text.slice(0, 250)}`;
            const correct = r.ok
              && text.includes('مسیر عمومی Caller')
              && text.includes('تماس صوتی در وضعیت فعلی production بسته است')
              && !text.includes('انتخاب شنونده، رزرو و تماس صوتی اینترنتی، حذف حساب و پشتیبانی فعال‌اند');
            if (correct) { console.log('public Privacy production gate truth PASS'); process.exit(0); }
            await new Promise(r => setTimeout(r, 3000));
          }
          throw new Error(`public Privacy did not converge: ${last}`);
          NODE

      - name: Dispatch and verify API production release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const expected = process.env.EXPECTED_MAIN_SHA;
          const workflow = 'deploy-production-api.yml';
          const headers = { authorization: `Bearer ${token}`, accept: 'application/vnd.github+json', 'content-type': 'application/json', 'x-github-api-version': '2022-11-28' };
          async function getRuns() {
            const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/runs?branch=main&event=workflow_dispatch&per_page=30`, { headers });
            if (!r.ok) throw new Error(`list API runs failed ${r.status}`);
            return (await r.json()).workflow_runs ?? [];
          }
          const before = new Set((await getRuns()).map(x => x.id));
          const dispatch = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/dispatches`, {
            method: 'POST', headers, body: JSON.stringify({ ref: 'main', inputs: { confirm: 'DEPLOY-PRODUCTION-API' } }),
          });
          if (dispatch.status !== 204) throw new Error(`API dispatch failed ${dispatch.status}: ${(await dispatch.text()).slice(0, 300)}`);
          let target = null;
          for (let i = 0; i < 60 && !target; i += 1) {
            const runs = await getRuns();
            target = runs.find(x => !before.has(x.id) && x.head_sha === expected && x.head_branch === 'main') ?? null;
            if (!target) await new Promise(r => setTimeout(r, 3000));
          }
          if (!target) throw new Error('API release run was not found after dispatch');
          console.log(`API release run ${target.id}`);
          for (let i = 0; i < 300; i += 1) {
            const r = await fetch(`https://api.github.com/repos/${repo}/actions/runs/${target.id}`, { headers });
            if (!r.ok) throw new Error(`API run read failed ${r.status}`);
            const run = await r.json();
            if (run.status === 'completed') {
              if (run.conclusion !== 'success') throw new Error(`API production release concluded ${run.conclusion}`);
              console.log('guarded API production release PASS');
              process.exit(0);
            }
            await new Promise(r => setTimeout(r, 5000));
          }
          throw new Error('API production release did not complete in guard window');
          NODE

      - name: Verify final public production state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const expected = process.env.EXPECTED_MAIN_SHA;
          const base = 'https://yeki-hast-unique-6ff0.vercel.app';
          async function json(path) {
            const r = await fetch(`${base}${path}`, { cache: 'no-store' });
            const text = await r.text();
            if (!r.ok) throw new Error(`${path} returned ${r.status}: ${text.slice(0, 200)}`);
            return JSON.parse(text);
          }
          const health = await json('/health');
          if (health?.ok !== true || health?.releaseSha !== expected) throw new Error('final health release SHA mismatch');
          const ready = await json('/ready');
          if (ready?.ok !== true || ready?.database !== 'ready' || ready?.schema !== 'ready') throw new Error('final readiness mismatch');
          const boot = await json('/v1/bootstrap');
          const legal = boot?.legal ?? {};
          if (boot?.features?.callerClosedBetaEnabled !== false) throw new Error('Caller gate unexpectedly open');
          if (legal?.ready !== true
            || legal?.privacyPolicyUrl !== 'https://yekihast.app/privacy'
            || legal?.termsOfServiceUrl !== 'https://yekihast.app/terms'
            || legal?.accountDeletionUrl !== 'https://yekihast.app/account/delete'
            || legal?.supportEmail !== 'sales@uniqueholding.com.tr') throw new Error('canonical public legal bootstrap mismatch');
          console.log('final production health/ready/bootstrap PASS');
          NODE
