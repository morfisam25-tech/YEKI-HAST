name: One-shot inspect existing Android vc5 AAB

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-inspect-android-vc5-aab.yml

permissions:
  contents: write

env:
  BASELINE_SHA: c2e2918c9ae171bf03f9b603f5bc665d00f3db0f
  CONTROLLER_PATH: .github/workflows/one-shot-inspect-android-vc5-aab.yml
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_CLI_VERSION: 23.2.0
  BUNDLETOOL_VERSION: 1.18.3
  EAS_BUILD_ID: 51dc645a-b56f-4428-91b5-73337898f870
  EXPECTED_SHA256: f843909c6a239d784f38c97c304310a64a7e4ab5c59410cd905de8b89bd06e32

jobs:
  inspect-existing-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact controller commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Self-remove and restore exact source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASELINE_SHA"
          rm "$CONTROLLER_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CONTROLLER_PATH"
          git commit -m "chore: remove one-shot vc5 AAB inspector"
          test "$(git rev-parse "$BASELINE_SHA^{tree}")" = "$(git rev-parse HEAD^{tree})"
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Resolve exact existing EAS build and download AAB
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          mkdir -p vc5-forensic
          cd apps/mobile
          npx --yes eas-cli@${EAS_CLI_VERSION} build:view "$EAS_BUILD_ID" --json > /tmp/eas-vc5.json
          cd ../..
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b = JSON.parse(fs.readFileSync('/tmp/eas-vc5.json','utf8'));
          if (b.id !== process.env.EAS_BUILD_ID) throw new Error('build id mismatch');
          if (b.status !== 'FINISHED' || b.platform !== 'ANDROID' || b.distribution !== 'STORE') throw new Error('unexpected build identity');
          if (b.appIdentifier !== 'app.yekihast.mobile' || b.appVersion !== '1.0.0' || String(b.appBuildVersion) !== '5') throw new Error('unexpected package/version');
          const url = b.artifacts?.applicationArchiveUrl ?? b.artifacts?.buildUrl;
          if (!url) throw new Error('missing AAB URL');
          fs.appendFileSync(process.env.GITHUB_ENV, `AAB_URL=${url}\n`);
          NODE
          curl --fail --location --retry 3 --output vc5-forensic/yeki-hast-1.0.0-vc5.aab "$AAB_URL"
          actual="$(sha256sum vc5-forensic/yeki-hast-1.0.0-vc5.aab | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          printf '%s  %s\n' "$actual" 'yeki-hast-1.0.0-vc5.aab' > vc5-forensic/yeki-hast-1.0.0-vc5.aab.sha256

      - name: Dump exact manifest and permission list
        shell: bash
        run: |
          set -euo pipefail
          BUNDLETOOL="/tmp/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --location --retry 3 --output "$BUNDLETOOL" "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar "$BUNDLETOOL" dump manifest --bundle=vc5-forensic/yeki-hast-1.0.0-vc5.aab > vc5-forensic/AndroidManifest.xml
          grep -o 'android.permission.[A-Z0-9_]*' vc5-forensic/AndroidManifest.xml | sort -u | tee vc5-forensic/declared-permissions.txt
          echo '--- risk matches ---'
          grep -E 'android.permission.(CAMERA|DUMP|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|WRITE_CONTACTS|GET_ACCOUNTS|READ_CALL_LOG|WRITE_CALL_LOG|READ_PHONE_STATE|READ_PHONE_NUMBERS|CALL_PHONE|READ_SMS|RECEIVE_SMS|SEND_SMS|AD_ID|SYSTEM_ALERT_WINDOW|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_AUDIO|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO)' vc5-forensic/AndroidManifest.xml || true

      - name: Upload vc5 forensic bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yeki-hast-vc5-aab-forensic
          path: vc5-forensic/
          if-no-files-found: error
          retention-days: 30
