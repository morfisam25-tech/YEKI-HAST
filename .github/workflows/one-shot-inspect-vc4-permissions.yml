name: One-shot inspect vc4 permissions

on:
  push:
    branches:
      - fix/v12-privacy-store-alignment
    paths:
      - .github/workflows/one-shot-inspect-vc4-permissions.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v12-privacy-store-alignment

      - name: Remove one-shot diagnostic from branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-inspect-vc4-permissions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-shot-inspect-vc4-permissions.yml
          git commit -m 'chore: remove one-shot vc4 permission inspector'
          git push origin HEAD:fix/v12-privacy-store-alignment

      - name: Download exact intermediate vc4 AAB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/yeki-vc4.aab 'https://expo.dev/artifacts/eas/lvW_O7FaaCggdE__tHblHMVt57ZO9l7MX_s3PLjHcxQ.aab'
          test -s /tmp/yeki-vc4.aab

      - name: Dump exact manifest permission surface
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/bundletool.jar 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar'
          java -jar /tmp/bundletool.jar dump manifest --bundle=/tmp/yeki-vc4.aab > /tmp/manifest.xml
          echo '=== DECLARED AND IMPLIED ANDROID PERMISSIONS ==='
          grep -o 'android.permission.[A-Z0-9_]*' /tmp/manifest.xml | sort -u
          echo '=== STORE-RISK MATCHES ==='
          grep -Eo 'android.permission.(CAMERA|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|WRITE_CONTACTS|READ_CALL_LOG|WRITE_CALL_LOG|READ_SMS|RECEIVE_SMS|SEND_SMS|AD_ID|SYSTEM_ALERT_WINDOW|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' /tmp/manifest.xml | sort -u || true
