name: One-shot refactor env endpoint

on:
  push:
    branches:
      - fix/api-canonical-legal-urls-final11

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/api-canonical-legal-urls-final11
          fetch-depth: 1
      - name: Refactor Vercel env endpoint once and self-remove
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/sync-vercel-production-env.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const beforeList = "const listUrl = `${API_ORIGIN}/v10/projects/${PROJECT_ID}/env?teamId=${encodeURIComponent(TEAM_ID)}`;\nconst listed = await vercelJson(listUrl);";
          const afterList = "const projectEnvUrl = new URL(`${API_ORIGIN}/v10/projects/${PROJECT_ID}/env`);\nprojectEnvUrl.searchParams.set('teamId', TEAM_ID);\nconst listed = await vercelJson(projectEnvUrl.toString());";
          const beforeUpdate = "const updateUrl = `${API_ORIGIN}/v10/projects/${PROJECT_ID}/env?upsert=true&teamId=${encodeURIComponent(TEAM_ID)}`;\nconst updated = await vercelJson(updateUrl, { method: 'POST', body: JSON.stringify(entries) });";
          const afterUpdate = "const updateUrl = new URL(projectEnvUrl);\nupdateUrl.searchParams.set('upsert', 'true');\nconst updated = await vercelJson(updateUrl.toString(), { method: 'POST', body: JSON.stringify(entries) });";
          for (const [before, after] of [[beforeList, afterList], [beforeUpdate, afterUpdate]]) {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`expected exactly one refactor source block, found ${count}`);
            text = text.replace(before, after);
          }
          if ((text.match(/\/v10\/projects\//g) ?? []).length !== 1) throw new Error('Vercel project env API must be source-defined exactly once');
          fs.writeFileSync(path, text);
          NODE
          node --check scripts/sync-vercel-production-env.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-refactor-env-endpoint.yml
          git add scripts/sync-vercel-production-env.mjs
          git commit -m 'fix: reuse one canonical Vercel project env endpoint'
          git push origin HEAD:fix/api-canonical-legal-urls-final11
