name: One-shot TURN provider audit vc5

on:
  push:
    branches:
      - ops/turn-provider-audit-vc5

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/turn-provider-audit-vc5
          fetch-depth: 1

      - name: Self-remove forensic workflow first
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-turn-provider-audit-vc5.yml
          git commit -m 'ops: remove one-shot TURN provider audit workflow'
          git push origin HEAD:ops/turn-provider-audit-vc5

      - name: Inspect production TURN host/provider hints safely
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_ijhc8kDsH24eQK5TfhFOqW8RVSxy
          TEAM_ID: team_GmseY3ibD05FWemVhLElL3hI
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?teamId=${TEAM_ID}&decrypt=true" \
            > "$response_file"

          RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.env.RESPONSE_FILE, 'utf8'));
          const envs = Array.isArray(body.envs) ? body.envs : [];

          function productionEntry(key) {
            return envs.find((e) => e && e.key === key && Array.isArray(e.target) && e.target.includes('production'))
              ?? envs.find((e) => e && e.key === key);
          }

          function safeUrlInfo(raw) {
            try {
              const text = String(raw || '').trim();
              const match = text.match(/^([a-z][a-z0-9+.-]*):(?:\/\/)?([^/?#]+)/i);
              if (!match) return null;
              const scheme = match[1].toLowerCase();
              const authority = match[2].replace(/^.*@/, '');
              const host = authority.startsWith('[')
                ? authority.slice(1, authority.indexOf(']'))
                : authority.split(':')[0];
              return { scheme, host: host.toLowerCase() };
            } catch {
              return null;
            }
          }

          function inspectIce(key) {
            const entry = productionEntry(key);
            if (!entry) return { key, present: false };
            let parsed;
            try { parsed = JSON.parse(String(entry.value || '')); }
            catch { return { key, present: true, parseable: false, target: entry.target || [] }; }
            if (!Array.isArray(parsed)) return { key, present: true, parseable: false, target: entry.target || [] };
            const endpoints = [];
            let credentialPairs = 0;
            for (const server of parsed) {
              if (!server || typeof server !== 'object') continue;
              const urls = Array.isArray(server.urls) ? server.urls : [server.urls];
              for (const url of urls) {
                const info = safeUrlInfo(url);
                if (info) endpoints.push(info);
              }
              if (String(server.username || '').length > 0 && String(server.credential || '').length > 0) credentialPairs++;
            }
            return {
              key,
              present: true,
              parseable: true,
              target: entry.target || [],
              endpointCount: endpoints.length,
              endpoints: [...new Map(endpoints.map((e) => [`${e.scheme}|${e.host}`, e])).values()],
              staticCredentialPairs: credentialPairs,
              hasTurn: endpoints.some((e) => e.scheme === 'turn' || e.scheme === 'turns'),
            };
          }

          function inspectHttps(key) {
            const entry = productionEntry(key);
            if (!entry) return { key, present: false };
            let host = null;
            try { host = new URL(String(entry.value || '')).hostname.toLowerCase(); } catch {}
            return { key, present: true, target: entry.target || [], hostname: host };
          }

          const report = {
            project: 'yeki-hast',
            productionEnvCount: envs.filter((e) => Array.isArray(e.target) && e.target.includes('production')).length,
            globalIce: inspectIce('INTERNET_VOICE_ICE_SERVERS_JSON'),
            iranIce: inspectIce('INTERNET_VOICE_IRAN_ICE_SERVERS_JSON'),
            iranControlPlane: inspectHttps('INTERNET_VOICE_IRAN_CONTROL_PLANE_BASE_URL'),
          };

          // This report intentionally contains only key presence, targets, protocols, hostnames,
          // endpoint counts and whether credential pairs exist. No values/usernames/credentials are emitted.
          const output = JSON.stringify(report, null, 2);
          console.log(output);
          fs.writeFileSync('turn-provider-audit-safe.json', output + '\n');
          NODE

      - name: Upload redacted audit report
        uses: actions/upload-artifact@v4
        with:
          name: turn-provider-audit-safe-vc5
          path: turn-provider-audit-safe.json
          retention-days: 30
          if-no-files-found: error
