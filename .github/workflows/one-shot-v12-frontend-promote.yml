name: One-shot v1.2 frontend verification and promotion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-v12-frontend-promote.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: yeki-hast-production-frontends
  cancel-in-progress: false

jobs:
  verify-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASELINE_SHA: aa97a8f0e4f8430dd90ba7748d4931f3afc2e7af
      ARTIFACT_RELEASE_SHA: d9cb1c35c12f751d428fa971868210150b4dbf84
      CONTROLLER_PATH: .github/workflows/one-shot-v12-frontend-promote.yml
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_GmseY3ibD05FWemVhLElL3hI
      VERCEL_TEAM_SLUG: unique-6ff0
      WEB_PROJECT_ID: prj_afhSiMYpsCfIAxuOmotLAWBvTMDg
      ADMIN_PROJECT_ID: prj_l18v3f003ORfiN6hKxYwJbvVPzzC
      WEB_EXACT_DEPLOYMENT_URL: https://web-o68dackpf-unique-6ff0.vercel.app
      ADMIN_EXACT_DEPLOYMENT_URL: https://admin-bgx9x7sgj-unique-6ff0.vercel.app
      WEB_PRODUCTION_URL: https://web-unique-6ff0.vercel.app
      ADMIN_PRODUCTION_URL: https://admin-unique-6ff0.vercel.app
      VERCEL_BIN: ${{ github.workspace }}/node_modules/.bin/vercel

    steps:
      - name: Checkout exact one-shot commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Restore exact QA-passed source before promotion
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "morfisam25-tech/YEKI-HAST"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^)" = "$BASELINE_SHA"
          test -n "${VERCEL_TOKEN:-}"

          rm "$CONTROLLER_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CONTROLLER_PATH"
          git commit -m "chore: remove one-shot v1.2 frontend promoter"
          RELEASE_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse "$BASELINE_SHA^{tree}")" = "$(git rev-parse HEAD^{tree})"
          git diff --quiet "$ARTIFACT_RELEASE_SHA" "$RELEASE_SHA" -- apps/web apps/admin packages package.json package-lock.json
          git push origin HEAD:main
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo 'one-shot promoter removed; exact QA-passed application tree restored'

      - name: Require unchanged remote main and green QA attestation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$RELEASE_SHA"
          GITHUB_SHA="$RELEASE_SHA" node scripts/require-green-foundation-qa.mjs

      - name: Setup exact release toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Install locked workspace and bind exact UNIQUE projects
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test -x "$VERCEL_BIN"
          "$VERCEL_BIN" --version
          rm -rf .vercel apps/web/.vercel apps/admin/.vercel
          mkdir -p apps/web/.vercel apps/admin/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$WEB_PROJECT_ID" > apps/web/.vercel/project.json
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$ADMIN_PROJECT_ID" > apps/admin/.vercel/project.json

      - name: Require exact staged deployments READY and protected
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_TEAM_ID;
          const sourceSha = process.env.ARTIFACT_RELEASE_SHA;
          const targets = [
            ['Web', process.env.WEB_EXACT_DEPLOYMENT_URL, process.env.WEB_PROJECT_ID],
            ['Admin', process.env.ADMIN_EXACT_DEPLOYMENT_URL, process.env.ADMIN_PROJECT_ID],
          ];
          function isProtected(response) {
            if (response.status === 401 || response.status === 403) return true;
            if (response.status < 300 || response.status >= 400) return false;
            const location = response.headers.get('location') || '';
            return response.status === 302 || /vercel\.com|\/_vercel\//i.test(location);
          }
          for (const [label, rawUrl, projectId] of targets) {
            const host = new URL(rawUrl).host;
            const endpoint = new URL(`https://api.vercel.com/v13/deployments/${encodeURIComponent(host)}`);
            endpoint.searchParams.set('teamId', teamId);
            const lookup = await fetch(endpoint, { headers: { authorization: `Bearer ${token}` } });
            if (!lookup.ok) throw new Error(`${label} deployment lookup failed (${lookup.status})`);
            const deployment = await lookup.json();
            if (deployment.projectId !== projectId) throw new Error(`${label} deployment project mismatch`);
            if (deployment.readyState !== 'READY') throw new Error(`${label} deployment is not READY (${deployment.readyState})`);
            const commit = deployment.meta?.githubCommitSha || deployment.meta?.gitCommitSha || null;
            if (commit && commit !== sourceSha) throw new Error(`${label} deployment source mismatch (${commit})`);
            const unauth = await fetch(rawUrl, { cache: 'no-store', redirect: 'manual' });
            if (!isProtected(unauth)) throw new Error(`${label} exact deployment is not protected (${unauth.status})`);
            console.log(`${label} exact identity/READY/protection PASS (${unauth.status})`);
          }
          NODE

      - name: Authenticated smoke exact Admin deployment
        working-directory: apps/admin
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"; trap 'rm -f "$tmp"' EXIT
          "$VERCEL_BIN" curl "$ADMIN_EXACT_DEPLOYMENT_URL" >"$tmp"
          grep -Fq 'یکی هست / عملیات' "$tmp"
          grep -Fq 'داشبورد' "$tmp"
          echo 'production exact protected Admin authenticated smoke PASS'

      - name: Authenticated smoke exact Web deployment
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          check_path() {
            local path="$1" needle="$2" tmp url
            tmp="$(mktemp)"
            url="${WEB_EXACT_DEPLOYMENT_URL}${path}"
            "$VERCEL_BIN" curl "$url" >"$tmp"
            grep -Fq "$needle" "$tmp"
            rm -f "$tmp"
          }
          check_path / 'ورود با ایمیل'
          check_path / 'mailto:sales@uniqueholding.com.tr'
          check_path /privacy 'حریم خصوصی'
          check_path /terms 'قوانین استفاده'
          check_path /account/delete 'تأیید مالک حساب'
          echo 'production exact protected Web authenticated smoke PASS'

      - name: Promote verified Admin deployment
        id: promote_admin
        working-directory: apps/admin
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" promote "$ADMIN_EXACT_DEPLOYMENT_URL" --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          echo 'verified Admin deployment promoted'

      - name: Require Admin canonical remains protected
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = process.env.ADMIN_PRODUCTION_URL;
          let last = 'no response';
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(url, { cache: 'no-store', redirect: 'manual' });
              const location = response.headers.get('location') || '';
              const ok = response.status === 401 || response.status === 403 || ((response.status >= 300 && response.status < 400) && (response.status === 302 || /vercel\.com|\/_vercel\//i.test(location)));
              if (ok) { console.log(`production Admin canonical protection PASS (${response.status})`); process.exit(0); }
              last = `unexpected status ${response.status}`;
            } catch (error) { last = error instanceof Error ? error.message : String(error); }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          throw new Error(`Admin protection failed after promotion: ${last}`);
          NODE

      - name: Promote verified Web deployment
        id: promote_web
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" promote "$WEB_EXACT_DEPLOYMENT_URL" --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          echo 'verified Web deployment promoted to production domains'

      - name: Verify public Web canonical Vercel surfaces
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.WEB_PRODUCTION_URL;
          async function waitFor(path, validate, label) {
            let last = 'no response';
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(`${base}${path}`, { cache: 'no-store', redirect: 'manual' });
                const text = await response.text();
                if (response.ok && validate(text)) { console.log(`${label} PASS`); return; }
                last = `${response.status} ${text.slice(0, 160)}`;
              } catch (error) { last = error instanceof Error ? error.message : String(error); }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error(`${label} failed: ${last}`);
          }
          await waitFor('/', text => text.includes('یکی هست') && text.includes('ورود با ایمیل') && text.includes('mailto:sales@uniqueholding.com.tr'), 'production Web landing smoke');
          await waitFor('/privacy', text => text.includes('حریم خصوصی') && text.includes('حذف حساب'), 'production Web privacy smoke');
          await waitFor('/terms', text => text.includes('قوانین استفاده') && text.includes('ماهیت سرویس'), 'production Web terms smoke');
          await waitFor('/account/delete', text => text.includes('حذف حساب') && text.includes('تأیید مالک حساب'), 'production Web account deletion smoke');
          console.log('production Web canonical Vercel smoke PASS');
          NODE

      - name: Probe custom domains without masking a DNS-provider blocker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const targets = [
            ['yekihast.app', 'https://yekihast.app/'],
            ['yeki-hast.com', 'https://yeki-hast.com/'],
          ];
          for (const [label, url] of targets) {
            try {
              const response = await fetch(url, { cache: 'no-store', redirect: 'manual', signal: AbortSignal.timeout(10000) });
              const text = await response.text();
              const location = response.headers.get('location') || '';
              const usable = (response.ok && text.includes('یکی هست')) || (response.status >= 300 && response.status < 400 && /yekihast\.app/i.test(location));
              if (usable) console.log(`custom domain ${label} PASS (${response.status})`);
              else console.log(`::warning::custom domain ${label} unresolved/misrouted (${response.status})`);
            } catch (error) {
              console.log(`::warning::custom domain ${label} DNS/network probe failed: ${error instanceof Error ? error.name : 'UnknownError'}`);
            }
          }
          NODE

      - name: Roll back Web if canonical verification failed after promotion
        if: ${{ failure() && steps.promote_web.conclusion == 'success' }}
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" rollback --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          "$VERCEL_BIN" rollback status --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          echo 'production Web rolled back after failed canonical verification'
