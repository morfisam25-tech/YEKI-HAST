name: One-shot v1.2 production release controller

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-v12-production-release.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: yeki-hast-v1-2-production-release-controller
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASELINE_SHA: 5586e22f1a7b7d39b3c83db080f0c48d9f1c4562
      CONTROLLER_PATH: .github/workflows/one-shot-v12-production-release.yml
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact controller commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Require exact reviewed baseline and remove controller before release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "morfisam25-tech/YEKI-HAST"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^)" = "$BASELINE_SHA"
          test "$(git rev-parse "$BASELINE_SHA^{tree}")" != "$(git rev-parse HEAD^{tree})"

          rm "$CONTROLLER_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CONTROLLER_PATH"
          git commit -m "chore: remove one-shot v1.2 release controller"
          RELEASE_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse "$BASELINE_SHA^{tree}")" = "$(git rev-parse HEAD^{tree})"
          git push origin HEAD:main
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "release source restored to the exact QA-passed application tree"

      - name: Require remote main unchanged and covered by green Foundation QA
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$RELEASE_SHA"
          GITHUB_SHA="$RELEASE_SHA" GITHUB_TOKEN="$GITHUB_TOKEN" node scripts/require-green-foundation-qa.mjs

      - name: Dispatch guarded migration and deployments sequentially
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.GITHUB_TOKEN?.trim();
          const repository = process.env.GITHUB_REPOSITORY?.trim();
          const releaseSha = process.env.RELEASE_SHA?.trim();
          if (!token || !repository || !/^[0-9a-f]{40}$/.test(releaseSha || '')) throw new Error('release controller environment incomplete');
          const api = 'https://api.github.com';
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${token}`,
            'content-type': 'application/json',
            'user-agent': 'yeki-hast-v1-2-release-controller',
            'x-github-api-version': '2022-11-28',
          };
          async function request(path, init = {}) {
            const response = await fetch(`${api}/repos/${repository}${path}`, { ...init, headers: { ...headers, ...(init.headers || {}) } });
            if (!response.ok && response.status !== 204) {
              const text = await response.text();
              throw new Error(`${path} failed (${response.status}): ${text.slice(0, 500)}`);
            }
            if (response.status === 204) return null;
            return response.json();
          }
          async function assertMain() {
            const branch = await request('/branches/main');
            if (branch?.commit?.sha !== releaseSha) throw new Error(`main moved during release: expected ${releaseSha}, got ${branch?.commit?.sha || 'unknown'}`);
          }
          async function dispatchAndWait(file, inputs, label, maxMinutes) {
            await assertMain();
            const runsPath = `/actions/workflows/${encodeURIComponent(file)}/runs?branch=main&event=workflow_dispatch&per_page=50`;
            const before = await request(runsPath);
            const prior = new Set((before?.workflow_runs || []).map((run) => run.id));
            await request(`/actions/workflows/${encodeURIComponent(file)}/dispatches`, {
              method: 'POST',
              body: JSON.stringify({ ref: 'main', inputs }),
            });
            const deadline = Date.now() + maxMinutes * 60_000;
            let runId = null;
            while (Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, 5000));
              const payload = await request(runsPath);
              const run = (payload?.workflow_runs || []).find((item) => !prior.has(item.id) && item.head_sha === releaseSha);
              if (!run) continue;
              runId = run.id;
              if (run.status !== 'completed') continue;
              if (run.conclusion !== 'success') throw new Error(`${label} failed: run ${run.id} concluded ${run.conclusion}`);
              console.log(`${label} PASS (run ${run.id})`);
              return run.id;
            }
            throw new Error(`${label} timed out${runId ? ` (run ${runId})` : ''}`);
          }

          await dispatchAndWait('migrate-production-db.yml', { confirm: 'MIGRATE_YEKI_HAST_PRODUCTION' }, 'production DB migration', 20);
          await dispatchAndWait('deploy-production-api.yml', { confirm: 'DEPLOY-PRODUCTION-API' }, 'production API deployment', 30);
          await dispatchAndWait('deploy-production-frontends-v4.yml', { confirm: 'DEPLOY-PRODUCTION-FRONTENDS' }, 'production Web/Admin deployment', 35);
          await assertMain();
          NODE

      - name: Final public smoke
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const releaseSha = process.env.RELEASE_SHA;
          async function requireOk(url, validate, label) {
            let last = 'no response';
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(url, { cache: 'no-store', redirect: 'manual' });
                const text = await response.text();
                if (response.ok && validate(text)) { console.log(`${label} PASS`); return; }
                last = `${response.status} ${text.slice(0, 180)}`;
              } catch (error) { last = error instanceof Error ? error.message : String(error); }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error(`${label} failed: ${last}`);
          }
          await requireOk('https://yeki-hast-unique-6ff0.vercel.app/health', (text) => {
            try { const body = JSON.parse(text); return body?.ok === true && body?.releaseSha === releaseSha; } catch { return false; }
          }, 'API exact-release health');
          await requireOk('https://yeki-hast-unique-6ff0.vercel.app/ready', (text) => {
            try { const body = JSON.parse(text); return body?.ok === true && body?.database === 'ready'; } catch { return false; }
          }, 'API readiness');
          await requireOk('https://yekihast.app/', (text) => text.includes('یکی هست') && text.includes('ورود با ایمیل'), 'Web canonical landing');
          await requireOk('https://yekihast.app/terms', (text) => text.includes('قوانین استفاده'), 'Web canonical terms');
          console.log(`v1.2 guarded production release PASS ${releaseSha}`);
          NODE
