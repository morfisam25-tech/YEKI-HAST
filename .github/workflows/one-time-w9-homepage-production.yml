name: One-time W9 Homepage Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-w9-homepage-production.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: yeki-hast-production-frontends
  cancel-in-progress: false

jobs:
  deploy-approved-home:
    if: github.event.head_commit.message == 'ci: deploy approved W9 homepage to production'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_GmseY3ibD05FWemVhLElL3hI
      VERCEL_TEAM_SLUG: unique-6ff0
      WEB_PROJECT_ID: prj_afhSiMYpsCfIAxuOmotLAWBvTMDg
      WEB_PROJECT_NAME: web
      ADMIN_PROJECT_ID: prj_l18v3f003ORfiN6hKxYwJbvVPzzC
      ADMIN_PROJECT_NAME: admin
      WEB_VERCEL_CANONICAL: https://web-unique-6ff0.vercel.app
      WEB_PRIMARY_DOMAIN: https://yekihast.app
      VERCEL_BIN: ${{ github.workspace }}/node_modules/.bin/vercel

    steps:
      - name: Verify one-time owner-authorized release context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "morfisam25-tech/YEKI-HAST"
          test "$GITHUB_EVENT_NAME" = "push"
          test -n "${VERCEL_TOKEN:-}" || { echo '::error::VERCEL_TOKEN repository secret is required'; exit 1; }

      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lock release to the approved homepage content
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'گاهی فقط لازمه تو حرفات‌و بزنی؛ یکی باشه که فقط گوش کنه' apps/web/app/page.tsx
          grep -Fq 'گفت‌وگوی عمومی فعلاً بسته است.' apps/web/app/page.tsx
          grep -Fq "url('/w9/two-rooms.webp')" apps/web/app/home.module.css
          test -f apps/web/public/w9/two-rooms.webp
          test -f apps/web/public/w9/generations.webp
          test -f apps/web/public/w9/one-tap.webp
          echo 'approved W9 homepage source lock PASS'

      - name: Wait for exact main Foundation QA to be green
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if node scripts/require-green-foundation-qa.mjs; then
              echo 'Foundation QA release gate PASS'
              exit 0
            fi
            echo "waiting for Foundation QA ($attempt/60)"
            sleep 10
          done
          echo '::error::Foundation QA did not become green in time'
          exit 1

      - name: Setup exact Node used by release tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Install locked workspace and require Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test -x "$VERCEL_BIN"

      - name: Capture current production deployment for rollback
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync } = await import('node:fs');
          const endpoint = new URL(`https://api.vercel.com/v13/deployments/${new URL(process.env.WEB_PRIMARY_DOMAIN).host}`);
          endpoint.searchParams.set('teamId', process.env.VERCEL_TEAM_ID);
          const response = await fetch(endpoint, { headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
          if (!response.ok) throw new Error(`unable to capture current production (${response.status})`);
          const d = await response.json();
          if (d.projectId !== process.env.WEB_PROJECT_ID || d.readyState !== 'READY') throw new Error('current production is not a READY expected Web deployment');
          const id = d.uid || d.id;
          if (!id || !d.url) throw new Error('current production deployment identity missing');
          appendFileSync(process.env.GITHUB_OUTPUT, `id=${id}\nurl=https://${d.url}\n`);
          console.log('current production captured for rollback');
          NODE

      - name: Bind exact Web project and pull production settings
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel ../../.vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$WEB_PROJECT_ID" > .vercel/project.json
          "$VERCEL_BIN" pull --yes --environment=production --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          test -f .vercel/.env.production.local

      - name: Build exact production artifact
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" build --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          test -f .vercel/output/config.json

      - name: Switch to proven repo-level monorepo deploy link
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/.vercel/output/config.json
          rm -f apps/web/.vercel/project.json
          rm -rf .vercel
          mkdir -p .vercel
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('.vercel/repo.json', `${JSON.stringify({
            remoteName: 'origin',
            projects: [
              { id: process.env.WEB_PROJECT_ID, name: process.env.WEB_PROJECT_NAME, directory: 'apps/web', orgId: process.env.VERCEL_TEAM_ID },
              { id: process.env.ADMIN_PROJECT_ID, name: process.env.ADMIN_PROJECT_NAME, directory: 'apps/admin', orgId: process.env.VERCEL_TEAM_ID },
            ],
          }, null, 2)}\n`);
          NODE

      - name: Deploy staged production without domain cutover
        id: staged
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          url="$("$VERCEL_BIN" deploy --prebuilt --prod --skip-domain --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG")"
          case "$url" in https://*.vercel.app) ;; *) echo '::error::invalid staged deployment URL'; exit 1 ;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo 'staged production deployment created'

      - name: Smoke approved homepage before cutover
        working-directory: apps/web
        env:
          STAGED_URL: ${{ steps.staged.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          check_path() {
            local path="$1" needle="$2" tmp
            tmp="$(mktemp)"
            "$VERCEL_BIN" curl "$path" --deployment "$STAGED_URL" >"$tmp"
            grep -Fq "$needle" "$tmp"
            rm -f "$tmp"
          }
          check_path / 'گاهی فقط لازمه تو حرفات‌و بزنی؛ یکی باشه که فقط گوش کنه'
          check_path / 'گفت‌وگوی عمومی فعلاً بسته است.'
          check_path /privacy 'حریم خصوصی'
          check_path /terms 'قوانین استفاده'
          check_path /account/delete 'حذف حساب'
          echo 'staged approved homepage smoke PASS'

      - name: Promote staged deployment to production
        id: promote
        working-directory: apps/web
        env:
          STAGED_URL: ${{ steps.staged.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" promote "$STAGED_URL" --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          echo 'approved homepage production promotion completed'

      - name: Verify live canonical homepage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const checks = [
            [process.env.WEB_VERCEL_CANONICAL, ['یکی هست', 'گاهی فقط لازمه تو حرفات‌و بزنی؛ یکی باشه که فقط گوش کنه', 'گفت‌وگوی عمومی فعلاً بسته است.']],
            [process.env.WEB_PRIMARY_DOMAIN, ['یکی هست', 'گاهی فقط لازمه تو حرفات‌و بزنی؛ یکی باشه که فقط گوش کنه', 'گفت‌وگوی عمومی فعلاً بسته است.']],
          ];
          for (const [base, needles] of checks) {
            let ok = false;
            let last = '';
            for (let attempt = 1; attempt <= 15; attempt++) {
              try {
                const response = await fetch(base, { cache: 'no-store' });
                const text = await response.text();
                last = `${response.status} ${text.slice(0, 100)}`;
                if (response.ok && needles.every((n) => text.includes(n))) { ok = true; break; }
              } catch (e) { last = String(e); }
              await new Promise(r => setTimeout(r, 3000));
            }
            if (!ok) throw new Error(`live homepage verification failed for ${base}: ${last}`);
            console.log(`live homepage PASS ${base}`);
          }
          NODE

      - name: Roll back if post-promotion verification fails
        if: ${{ failure() && steps.promote.outcome == 'success' }}
        working-directory: apps/web
        env:
          PREVIOUS_URL: ${{ steps.previous.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIOUS_URL"
          "$VERCEL_BIN" promote "$PREVIOUS_URL" --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          echo 'previous production deployment restored after failed verification'
