name: One-time W9 Homepage Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-w9-homepage-production.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: yeki-hast-production-frontends
  cancel-in-progress: false

jobs:
  deploy-approved-home:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_GmseY3ibD05FWemVhLElL3hI
      VERCEL_TEAM_SLUG: unique-6ff0
      WEB_PROJECT_ID: prj_afhSiMYpsCfIAxuOmotLAWBvTMDg
      WEB_PROJECT_NAME: web
      ADMIN_PROJECT_ID: prj_l18v3f003ORfiN6hKxYwJbvVPzzC
      ADMIN_PROJECT_NAME: admin
      WEB_VERCEL_CANONICAL: https://web-unique-6ff0.vercel.app
      WEB_PRIMARY_DOMAIN: https://yekihast.app
      VERCEL_BIN: ${{ github.workspace }}/node_modules/.bin/vercel

    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify owner-approved homepage source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "morfisam25-tech/YEKI-HAST"
          test -n "${VERCEL_TOKEN:-}"
          grep -Fq 'گاهی فقط لازمه تو حرفات‌و بزنی؛ یکی باشه که فقط گوش کنه' apps/web/app/page.tsx
          grep -Fq 'گفت‌وگوی عمومی فعلاً بسته است.' apps/web/app/page.tsx
          grep -Fq "url('/w9/two-rooms.webp')" apps/web/app/home.module.css
          test -f apps/web/public/w9/two-rooms.webp
          test -f apps/web/public/w9/generations.webp
          test -f apps/web/public/w9/one-tap.webp
          echo 'approved homepage source PASS'

      - name: Wait for exact Foundation QA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if node scripts/require-green-foundation-qa.mjs; then
              echo 'Foundation QA release gate PASS'
              exit 0
            fi
            echo "waiting for exact Foundation QA ($attempt/60)"
            sleep 10
          done
          exit 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Install locked workspace
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test -x "$VERCEL_BIN"

      - name: Capture current production for rollback
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync } = await import('node:fs');
          const host = new URL(process.env.WEB_PRIMARY_DOMAIN).host;
          const endpoint = new URL(`https://api.vercel.com/v13/deployments/${host}`);
          endpoint.searchParams.set('teamId', process.env.VERCEL_TEAM_ID);
          const response = await fetch(endpoint, { headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
          if (!response.ok) throw new Error(`capture failed ${response.status}`);
          const d = await response.json();
          if (d.projectId !== process.env.WEB_PROJECT_ID || d.readyState !== 'READY') throw new Error('unexpected current production');
          const id = d.uid || d.id;
          if (!id || !d.url) throw new Error('missing current production identity');
          appendFileSync(process.env.GITHUB_OUTPUT, `id=${id}\nurl=https://${d.url}\n`);
          console.log('rollback target captured');
          NODE

      - name: Pull and build Web production artifact
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel ../../.vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$WEB_PROJECT_ID" > .vercel/project.json
          "$VERCEL_BIN" pull --yes --environment=production --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          "$VERCEL_BIN" build --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          test -f .vercel/output/config.json

      - name: Prepare proven monorepo deploy link
        shell: bash
        run: |
          set -euo pipefail
          rm -f apps/web/.vercel/project.json
          rm -rf .vercel
          mkdir -p .vercel
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('.vercel/repo.json', JSON.stringify({
            remoteName: 'origin',
            projects: [
              { id: process.env.WEB_PROJECT_ID, name: process.env.WEB_PROJECT_NAME, directory: 'apps/web', orgId: process.env.VERCEL_TEAM_ID },
              { id: process.env.ADMIN_PROJECT_ID, name: process.env.ADMIN_PROJECT_NAME, directory: 'apps/admin', orgId: process.env.VERCEL_TEAM_ID }
            ]
          }, null, 2));
          NODE

      - name: Stage exact production deployment
        id: staged
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          url="$("$VERCEL_BIN" deploy --prebuilt --prod --skip-domain --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG")"
          case "$url" in https://*.vercel.app) ;; *) exit 1 ;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo 'staged deployment READY for smoke'

      - name: Smoke staged homepage before cutover
        working-directory: apps/web
        env:
          STAGED_URL: ${{ steps.staged.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          check_path() {
            local path="$1" needle="$2" tmp
            tmp="$(mktemp)"
            "$VERCEL_BIN" curl "$path" --deployment "$STAGED_URL" >"$tmp"
            grep -Fq "$needle" "$tmp"
            rm -f "$tmp"
          }
          check_path / 'گاهی فقط لازمه تو حرفات‌و بزنی؛ یکی باشه که فقط گوش کنه'
          check_path / 'گفت‌وگوی عمومی فعلاً بسته است.'
          check_path /privacy 'حریم خصوصی'
          check_path /terms 'قوانین استفاده'
          check_path /account/delete 'حذف حساب'
          echo 'staged smoke PASS'

      - name: Promote verified staged deployment
        id: promote
        working-directory: apps/web
        env:
          STAGED_URL: ${{ steps.staged.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" promote "$STAGED_URL" --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          echo 'production promotion complete'

      - name: Verify live homepage on canonical domains
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const targets = [process.env.WEB_VERCEL_CANONICAL, process.env.WEB_PRIMARY_DOMAIN];
          const needles = ['یکی هست', 'گاهی فقط لازمه تو حرفات‌و بزنی؛ یکی باشه که فقط گوش کنه', 'گفت‌وگوی عمومی فعلاً بسته است.'];
          for (const target of targets) {
            let passed = false;
            for (let attempt = 1; attempt <= 15; attempt++) {
              try {
                const response = await fetch(target, { cache: 'no-store' });
                const text = await response.text();
                if (response.ok && needles.every((needle) => text.includes(needle))) { passed = true; break; }
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
            if (!passed) throw new Error(`live verification failed ${target}`);
            console.log(`live homepage PASS ${target}`);
          }
          NODE

      - name: Restore previous production on failed post-promotion verification
        if: ${{ failure() && steps.promote.outcome == 'success' }}
        working-directory: apps/web
        env:
          PREVIOUS_URL: ${{ steps.previous.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIOUS_URL"
          "$VERCEL_BIN" promote "$PREVIOUS_URL" --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          echo 'rollback completed'
