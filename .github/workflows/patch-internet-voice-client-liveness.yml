name: One-shot Internet Voice client liveness guards

on:
  push:
    branches:
      - feat/v1-2-internet-voice-foundation
    paths:
      - .github/workflows/patch-internet-voice-client-liveness.yml
      - .github/scripts/patch-internet-voice-client-liveness.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v1-2-internet-voice-foundation
          fetch-depth: 0

      - name: Apply client liveness guards
        run: python .github/scripts/patch-internet-voice-client-liveness.py

      - name: Run focused client and server liveness guards
        run: |
          node --experimental-strip-types --test tests/internet-voice-client-liveness.test.ts
          node --experimental-strip-types --test tests/internet-voice-liveness.test.ts

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/patch-internet-voice-client-liveness.yml
          rm .github/scripts/patch-internet-voice-client-liveness.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/talk/page.tsx apps/web/app/listener/work/page.tsx apps/mobile/src/CallerClosedBetaScreen.tsx apps/mobile/src/ListenerActiveCallCard.tsx tests/internet-voice-client-liveness.test.ts .github/workflows/patch-internet-voice-client-liveness.yml .github/scripts/patch-internet-voice-client-liveness.py
          git diff --cached --check
          git commit -m "fix: gate voice heartbeats on live peer state"
          git push origin HEAD:feat/v1-2-internet-voice-foundation