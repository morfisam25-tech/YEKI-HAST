name: One-shot KYC and mobile state hardening

on:
  push:
    branches:
      - feat/v1-2-internet-voice-foundation
    paths:
      - .github/workflows/patch-listener-kyc-mobile-state.yml
      - .github/scripts/patch-listener-kyc-mobile-state.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v1-2-internet-voice-foundation
          fetch-depth: 0

      - name: Apply KYC and mobile state patch
        run: python .github/scripts/patch-listener-kyc-mobile-state.py

      - name: Run focused guard test
        run: node --experimental-strip-types --test tests/listener-kyc-mobile-state-guard.test.ts

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/patch-listener-kyc-mobile-state.yml
          rm .github/scripts/patch-listener-kyc-mobile-state.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/src/routes/kyc.ts services/api/src/routes/admin-kyc.ts apps/web/app/listener/page.tsx apps/mobile/src/ListenerKycScreen.tsx apps/mobile/src/ListenerTrainingScreen.tsx tests/listener-kyc-mobile-state-guard.test.ts .github/workflows/patch-listener-kyc-mobile-state.yml .github/scripts/patch-listener-kyc-mobile-state.py
          git diff --cached --check
          git commit -m "fix: lock Listener KYC and post-onboarding states"
          git push origin HEAD:feat/v1-2-internet-voice-foundation