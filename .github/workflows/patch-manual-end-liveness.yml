name: One-shot manual end liveness hardening

on:
  push:
    branches:
      - feat/v1-2-internet-voice-foundation
    paths:
      - scripts/patch-manual-end-liveness.mjs
      - .github/workflows/patch-manual-end-liveness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v1-2-internet-voice-foundation
          fetch-depth: 0
      - name: Apply manual end liveness patch
        run: node scripts/patch-manual-end-liveness.mjs
      - name: Run focused billing and voice guards
        run: |
          node --test --experimental-strip-types tests/internet-voice-manual-end-liveness.test.ts
          node --test --experimental-strip-types tests/mobile-internet-voice-v1-2.test.ts
          node --test --experimental-strip-types tests/internet-voice-server-sweeper.test.ts
      - name: Commit patch and remove temporary files
        run: |
          rm scripts/patch-manual-end-liveness.mjs
          rm .github/workflows/patch-manual-end-liveness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stop manual billing at unresolved peer disconnect"
          git push origin HEAD:feat/v1-2-internet-voice-foundation
