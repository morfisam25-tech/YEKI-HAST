name: One-shot mobile consent parity patch

on:
  push:
    branches:
      - feat/v1-2-internet-voice-foundation
    paths:
      - .github/workflows/patch-mobile-consent-v12.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/v1-2-internet-voice-foundation
          fetch-depth: 0

      - name: Apply compact deterministic patch
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          api = Path('apps/mobile/src/api.ts')
          a = api.read_text()
          start = a.index('export function confirmCallerAge(')
          end = a.index('\n\nexport function joinCallerWaitlist', start)
          new_api = """export function confirmCallerAge(
            token: string,
            input: { termsAccepted: boolean; safetyAccepted: boolean },
          ): Promise<{
            ok: true;
            minimumAge: number;
            policyVersion: string;
            termsVersion: string;
            safetyProtocolVersion: string;
          }> {
            return request('/v1/caller/age-gate', {
              method: 'POST',
              body: JSON.stringify({
                confirmed: true,
                termsAccepted: input.termsAccepted,
                safetyAccepted: input.safetyAccepted,
              }),
            }, token);
          }"""
          api.write_text(a[:start] + new_api + a[end:])

          screen = Path('apps/mobile/src/CallerClosedBetaScreen.tsx')
          s = screen.read_text()
          needle = "    caller_age_gate_required: 'برای ادامه باید شرط سنی نسخه جاری را تأیید کنی.',\n"
          assert needle in s
          s = s.replace(needle, needle + "    caller_consent_required: 'برای ادامه باید قوانین استفاده و مرزبندی ایمنی را بپذیری.',\n", 1)
          needle = "  const [minimumAge, setMinimumAge] = useState<number | null>(null);\n"
          assert needle in s
          s = s.replace(needle, needle + "  const [ageConfirmed, setAgeConfirmed] = useState(false);\n  const [termsAccepted, setTermsAccepted] = useState(false);\n  const [safetyAccepted, setSafetyAccepted] = useState(false);\n", 1)
          needle = "  const noAnswerExpiryInFlightRef = useRef(false);\n"
          assert needle in s
          s = s.replace(needle, needle + "  const policiesReady = ageConfirmed && termsAccepted && safetyAccepted;\n", 1)
          assert "    if (recoveryBlocked) return;\n" in s
          s = s.replace("    if (recoveryBlocked) return;\n", "    if (recoveryBlocked || !policiesReady) return;\n", 1)
          assert "      const result = await confirmCallerAge(token);\n" in s
          s = s.replace("      const result = await confirmCallerAge(token);\n", "      const result = await confirmCallerAge(token, { termsAccepted, safetyAccepted });\n", 1)

          ui_start = s.index("      {recoveryComplete && !recoveryBlocked && stage === 'age-gate' && (")
          ui_end = s.index("\n\n      {recoveryComplete && !recoveryBlocked && stage === 'browse'", ui_start)
          new_ui = """      {recoveryComplete && !recoveryBlocked && stage === 'age-gate' && (
            <View style={styles.card}>
              <Text style={styles.heading}>تأیید سن و قوانین</Text>
              <Text style={styles.body}>قبل از دیدن شنونده‌ها هر سه مورد را جداگانه تأیید کن.</Text>
              <TouchableOpacity disabled={busy} style={[styles.policyRow, ageConfirmed && styles.policyRowActive]} onPress={() => setAgeConfirmed((current) => !current)}>
                <Text style={styles.policyText}>{ageConfirmed ? '☑' : '☐'} تأیید می‌کنم حداقل سن اعلام‌شده سرویس را دارم.</Text>
              </TouchableOpacity>
              <TouchableOpacity disabled={busy} style={[styles.policyRow, termsAccepted && styles.policyRowActive]} onPress={() => setTermsAccepted((current) => !current)}>
                <Text style={styles.policyText}>{termsAccepted ? '☑' : '☐'} قوانین استفاده را خواندم و می‌پذیرم. لینک «قوانین استفاده» پایین صفحه در دسترس است.</Text>
              </TouchableOpacity>
              <TouchableOpacity disabled={busy} style={[styles.policyRow, safetyAccepted && styles.policyRowActive]} onPress={() => setSafetyAccepted((current) => !current)}>
                <Text style={styles.policyText}>{safetyAccepted ? '☑' : '☐'} می‌پذیرم محترمانه رفتار کنم؛ اینجا محل دوست‌یابی یا مشاوره تخصصی نیست و اطلاعات تماس شخصی ردوبدل نمی‌کنم.</Text>
              </TouchableOpacity>
              <TouchableOpacity disabled={busy || !policiesReady} style={[styles.primary, !policiesReady && styles.disabled]} onPress={acceptAgeGate}>
                <Text style={styles.primaryText}>{busy ? 'در حال بررسی…' : 'تأیید و ادامه'}</Text>
              </TouchableOpacity>
            </View>
          )}"""
          s = s[:ui_start] + new_ui + s[ui_end:]
          s = s.replace("listener.verified ? 'وضعیت تأییدشده' : 'اطلاعات تأییدنشده'", "listener.verified ? 'هویت/فیلدهای تأییدشده مشخص است' : 'اطلاعات تأییدنشده'", 1)
          s = s.replace("معرفی خوداظهاری: {listener.shortIntro}", "معرفی خوداظهاری (تأییدنشده): {listener.shortIntro}", 1)
          needle = "  primaryText: { color: '#FFF', textAlign: 'center', fontWeight: '700' },\n"
          assert needle in s
          s = s.replace(needle, needle + "  disabled: { opacity: 0.45 },\n  policyRow: { borderWidth: 1, borderColor: '#D8D1C7', borderRadius: 12, padding: 12, backgroundColor: '#FFF' },\n  policyRowActive: { borderColor: '#171717', backgroundColor: '#F3F0EA' },\n  policyText: { fontSize: 13, lineHeight: 21, textAlign: 'right' },\n", 1)
          screen.write_text(s)

          test = Path('tests/caller-mobile-closed-beta.test.ts')
          t = test.read_text()
          t_start = t.index("test('closed-beta caller shell requires server age confirmation before browse flow'")
          t_end = t.index("\n\ntest('closed-beta caller shell exposes", t_start)
          new_test = """test('closed-beta caller shell requires explicit current age, Terms and safety consent before browse flow', () => {
            const consent = caller.indexOf('await confirmCallerAge(token, { termsAccepted, safetyAccepted })');
            const browse = caller.indexOf('await browseListeners(token');
            assert.ok(consent >= 0 && browse > consent);
            assert.match(caller, /const policiesReady = ageConfirmed && termsAccepted && safetyAccepted/);
            assert.match(caller, /disabled=\\{busy \\|\\| !policiesReady\\}/);
            assert.match(caller, /قوانین استفاده را خواندم و می‌پذیرم/);
            assert.match(caller, /اینجا محل دوست‌یابی یا مشاوره تخصصی نیست/);
            assert.match(api, /termsAccepted: input\\.termsAccepted/);
            assert.match(api, /safetyAccepted: input\\.safetyAccepted/);
            assert.match(caller, /stage === 'age-gate'/);
          });"""
          test.write_text(t[:t_start] + new_test + t[t_end:])
          PY
          sed -i 's/^          //' /tmp/patch.py
          python /tmp/patch.py
          grep -q "confirmCallerAge(token, { termsAccepted, safetyAccepted })" apps/mobile/src/CallerClosedBetaScreen.tsx
          grep -q "معرفی خوداظهاری (تأییدنشده)" apps/mobile/src/CallerClosedBetaScreen.tsx
          grep -q "termsAccepted: input.termsAccepted" apps/mobile/src/api.ts

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/patch-mobile-consent-v12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/api.ts apps/mobile/src/CallerClosedBetaScreen.tsx tests/caller-mobile-closed-beta.test.ts .github/workflows/patch-mobile-consent-v12.yml
          git diff --cached --check
          git commit -m "feat: enforce caller consent parity on mobile"
          git push origin HEAD:feat/v1-2-internet-voice-foundation
