name: One-shot readiness liveness guard

on:
  push:
    branches:
      - feat/v1-2-internet-voice-foundation
    paths:
      - .github/workflows/patch-readiness-liveness.yml
      - .github/scripts/patch-readiness-liveness.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v1-2-internet-voice-foundation
          fetch-depth: 0

      - name: Apply readiness liveness guard
        run: python .github/scripts/patch-readiness-liveness.py

      - name: Run focused liveness guards
        run: node --experimental-strip-types --test tests/internet-voice-liveness.test.ts

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/patch-readiness-liveness.yml
          rm .github/scripts/patch-readiness-liveness.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index.ts tests/internet-voice-liveness.test.ts .github/workflows/patch-readiness-liveness.yml .github/scripts/patch-readiness-liveness.py
          git diff --cached --check
          git commit -m "fix: require voice liveness schema in readiness"
          git push origin HEAD:feat/v1-2-internet-voice-foundation