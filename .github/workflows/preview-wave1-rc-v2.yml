name: Preview Wave 1 RC Web V2

on:
  push:
    branches:
      - preview/wave1-rc-v2-20260908

permissions:
  contents: read

concurrency:
  group: yeki-hast-wave1-preview-v2
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_GmseY3ibD05FWemVhLElL3hI
      VERCEL_TEAM_SLUG: unique-6ff0
      WEB_PROJECT_ID: prj_afhSiMYpsCfIAxuOmotLAWBvTMDg
      WEB_PROJECT_NAME: web
      VERCEL_BIN: ${{ github.workspace }}/node_modules/.bin/vercel

    steps:
      - name: Checkout preview source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup release Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Install locked workspace and Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test -x "$VERCEL_BIN"

      - name: Bind exact Web project for build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel apps/web/.vercel
          mkdir -p apps/web/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$WEB_PROJECT_ID" > apps/web/.vercel/project.json

      - name: Pull Web preview settings
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" pull --yes --environment=preview --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          test -f .vercel/project.json

      - name: Build Web preview artifact
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" build --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          test -f .vercel/output/config.json

      - name: Switch to repo-level monorepo deploy link
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/.vercel/output/config.json
          rm -f apps/web/.vercel/project.json
          rm -rf .vercel
          mkdir -p .vercel
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            remoteName: 'origin',
            projects: [
              { id: process.env.WEB_PROJECT_ID, name: process.env.WEB_PROJECT_NAME, directory: 'apps/web', orgId: process.env.VERCEL_TEAM_ID },
            ],
          };
          fs.writeFileSync('.vercel/repo.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE
          test -f .vercel/repo.json
          test -f apps/web/.vercel/output/config.json

      - name: Deploy prebuilt Web preview only
        id: deploy
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$("$VERCEL_BIN" deploy --prebuilt --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG")"
          case "$deployment_url" in
            https://*.vercel.app) ;;
            *) echo '::error::Vercel did not return a preview URL'; exit 1 ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Wave 1 RC preview deployed: $deployment_url"
