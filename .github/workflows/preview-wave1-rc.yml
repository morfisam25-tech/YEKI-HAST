name: Preview Frozen Wave 1 RC Web

on:
  push:
    branches:
      - preview/wave1-rc-20260908

permissions:
  contents: read

concurrency:
  group: yeki-hast-wave1-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_GmseY3ibD05FWemVhLElL3hI
      VERCEL_TEAM_SLUG: unique-6ff0
      WEB_PROJECT_ID: prj_afhSiMYpsCfIAxuOmotLAWBvTMDg
      VERCEL_BIN: ${{ github.workspace }}/node_modules/.bin/vercel

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup release Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Install locked workspace tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test -x "$VERCEL_BIN"

      - name: Link exact Web project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$WEB_PROJECT_ID" > .vercel/project.json

      - name: Pull preview environment
        shell: bash
        run: |
          set -euo pipefail
          "$VERCEL_BIN" pull --yes --environment=preview --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"

      - name: Deploy Web preview only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$("$VERCEL_BIN" deploy --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG")"
          case "$deployment_url" in
            https://*.vercel.app) ;;
            *) echo '::error::Vercel did not return a preview URL'; exit 1 ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$deployment_url"

      - name: Authenticated preview smoke
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          "$VERCEL_BIN" curl / --deployment "$PREVIEW_URL" --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG" > "$tmp"
          grep -Fq 'یکی هست' "$tmp"
          echo "Wave 1 RC Web preview smoke PASS: $PREVIEW_URL"
