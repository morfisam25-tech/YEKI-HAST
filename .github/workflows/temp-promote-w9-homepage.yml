name: Temporary Promote W9 Homepage

on:
  push:
    branches:
      - hotfix/w9-homepage-live-20260909
    paths:
      - .github/workflows/temp-promote-w9-homepage.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/w9-homepage-live-20260909
          fetch-depth: 0

      - name: Copy only approved W9 homepage files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ef608ccd10dec97af11da526ffd386060487d8b1
          git checkout FETCH_HEAD -- \
            apps/web/app/page.tsx \
            apps/web/app/home.module.css \
            apps/web/public/w9/two-rooms.webp \
            apps/web/public/w9/generations.webp \
            apps/web/public/w9/one-tap.webp
          git rm .github/workflows/temp-promote-w9-homepage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/page.tsx apps/web/app/home.module.css apps/web/public/w9
          git commit -m "Promote approved W9 homepage only"
          git push origin HEAD:hotfix/w9-homepage-live-20260909
