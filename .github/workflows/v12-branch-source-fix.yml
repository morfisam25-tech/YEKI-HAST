name: Apply v1.2 branch source fixes

on:
  push:
    branches: [feat/v1-2-internet-voice-foundation]
    paths:
      - .github/workflows/v12-branch-source-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v1-2-internet-voice-foundation
      - name: Patch source contracts
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          # Caller read model must expose the safe transport discriminator so recovered
          # calls can re-enter the correct Internet Voice/PSTN path without bridge ids.
          p = Path('services/api/src/routes/calls.ts')
          s = p.read_text()
          s = replace_once(s,
              '  max_billable_seconds: number | null;\n  provider_bridge_id: string | null;\n}) {',
              "  max_billable_seconds: number | null;\n  transport: 'internet_voice' | 'masked_pstn' | null;\n  provider_bridge_id: string | null;\n}) {",
              'snapshot type')
          s = replace_once(s,
              '    maxBillableSeconds: row.max_billable_seconds,\n    telephonyReady: Boolean(row.provider_bridge_id),',
              '    maxBillableSeconds: row.max_billable_seconds,\n    transport: row.transport,\n    telephonyReady: Boolean(row.provider_bridge_id),',
              'snapshot transport')
          s = s.replace(
              'authorized_minor: string; max_billable_seconds: number | null; provider_bridge_id: string | null;',
              "authorized_minor: string; max_billable_seconds: number | null; transport: 'internet_voice' | 'masked_pstn' | null; provider_bridge_id: string | null;",
          )
          s = s.replace(
              'authorized_minor::text, max_billable_seconds, provider_bridge_id',
              'authorized_minor::text, max_billable_seconds, transport::text, provider_bridge_id',
          )
          s = s.replace(
              'authorized_minor::text, max_billable_seconds, provider_bridge_id\n    `, [',
              'authorized_minor::text, max_billable_seconds, transport::text, provider_bridge_id\n    `, [',
          )
          s = s.replace(
              'caller_charge_minor: string; provider_bridge_id: string | null; termination_in_progress: boolean;',
              "caller_charge_minor: string; transport: 'internet_voice' | 'masked_pstn' | null; provider_bridge_id: string | null; termination_in_progress: boolean;",
          )
          s = s.replace(
              'cs.provider_bridge_id,\n           EXISTS (',
              'cs.transport::text, cs.provider_bridge_id,\n           EXISTS (',
          )
          s = s.replace(
              '      maxBillableSeconds: row.max_billable_seconds,\n      telephonyReady: Boolean(row.provider_bridge_id),',
              '      maxBillableSeconds: row.max_billable_seconds,\n      transport: row.transport,\n      telephonyReady: Boolean(row.provider_bridge_id),',
          )
          s = s.replace(
              '    maxBillableSeconds: row.max_billable_seconds,\n    telephonyReady: Boolean(row.provider_bridge_id),',
              '    maxBillableSeconds: row.max_billable_seconds,\n    transport: row.transport,\n    telephonyReady: Boolean(row.provider_bridge_id),',
          )
          p.write_text(s)

          # Mobile public types mirror the safe transport discriminator; no provider ids.
          p = Path('apps/mobile/src/api.ts')
          s = p.read_text()
          s = replace_once(s,
              "  maxBillableSeconds: number | null;\n  telephonyReady: boolean;",
              "  maxBillableSeconds: number | null;\n  transport: 'internet_voice' | 'masked_pstn' | null;\n  internetVoiceReady: boolean;\n  telephonyReady: boolean;",
              'listener mobile transport type')
          s = replace_once(s,
              '  maxBillableSeconds?: number | null;\n  requestedAt?: string;',
              "  maxBillableSeconds?: number | null;\n  transport?: 'internet_voice' | 'masked_pstn' | null;\n  requestedAt?: string;",
              'caller mobile transport type')
          p.write_text(s)

          # Wallet top-up is available only after the server age gate has succeeded.
          p = Path('apps/mobile/src/CallerClosedBetaScreen.tsx')
          s = p.read_text()
          s = replace_once(s,
              "{recoveryComplete && !recoveryBlocked && stage !== 'call' && <CallerWalletCard token={token} />}",
              "{recoveryComplete && !recoveryBlocked && stage === 'browse' && <CallerWalletCard token={token} />}",
              'caller wallet gate')
          p.write_text(s)

          # Voice signaling/heartbeat must be foreground-aware and jittered; no setInterval.
          p = Path('apps/mobile/src/ListenerActiveCallCard.tsx')
          s = p.read_text()
          s = replace_once(s,
              'const SIGNAL_POLL_MS = 1_000;\nconst HEARTBEAT_MS = 5_000;',
              "const SIGNAL_POLL_BASE_MS = 900;\nconst SIGNAL_POLL_JITTER_MS = 500;\nconst HEARTBEAT_BASE_MS = 4_500;\nconst HEARTBEAT_JITTER_MS = 1_500;\n\nfunction voicePollDelayMs(base: number, jitter: number): number {\n  return base + Math.floor(Math.random() * (jitter + 1));\n}",
              'voice timer constants')
          s = replace_once(s,
              'async function consumeCallerSignal(signal: InternetVoiceSignal) {',
              'async function consumeCallerSignal(callId: string, signal: InternetVoiceSignal) {',
              'signal call id signature')
          s = replace_once(s,
              "postInternetVoiceSignal(token, activeCallIdRef.current ?? '', 'answer'",
              "postInternetVoiceSignal(token, callId, 'answer'",
              'answer call id')
          s = replace_once(s,
              'await consumeCallerSignal(offer);',
              'await consumeCallerSignal(activeCall.callId, offer);',
              'offer call id')
          s = replace_once(s,
              "if (signal.kind === 'ice' && signal.senderRole === 'caller') await consumeCallerSignal(signal);",
              "if (signal.kind === 'ice' && signal.senderRole === 'caller') await consumeCallerSignal(activeCall.callId, signal);",
              'initial ice call id')
          s = replace_once(s,
              'try { await consumeCallerSignal(signal); }',
              'try { await consumeCallerSignal(callId, signal); }',
              'poll signal call id')
          s = replace_once(s,
              "    void pollSignals();\n    const timer = setInterval(() => { void pollSignals(); }, SIGNAL_POLL_MS);\n    return () => { disposed = true; clearInterval(timer); };",
              "    let timer: ReturnType<typeof setTimeout> | null = null;\n    async function scheduleSignals() {\n      if (disposed) return;\n      if (appStateRef.current === 'active') await pollSignals();\n      if (!disposed) timer = setTimeout(() => { void scheduleSignals(); }, voicePollDelayMs(SIGNAL_POLL_BASE_MS, SIGNAL_POLL_JITTER_MS));\n    }\n    void scheduleSignals();\n    return () => { disposed = true; if (timer) clearTimeout(timer); };",
              'signal polling')
          s = replace_once(s,
              "    void heartbeat();\n    const timer = setInterval(() => { void heartbeat(); }, HEARTBEAT_MS);\n    return () => { disposed = true; clearInterval(timer); };",
              "    let timer: ReturnType<typeof setTimeout> | null = null;\n    async function scheduleHeartbeat() {\n      if (disposed) return;\n      if (appStateRef.current === 'active') await heartbeat();\n      if (!disposed) timer = setTimeout(() => { void scheduleHeartbeat(); }, voicePollDelayMs(HEARTBEAT_BASE_MS, HEARTBEAT_JITTER_MS));\n    }\n    void scheduleHeartbeat();\n    return () => { disposed = true; if (timer) clearTimeout(timer); };",
              'heartbeat polling')
          if 'setInterval' in s:
              raise SystemExit('listener still contains setInterval')
          p.write_text(s)

      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git add services/api/src/routes/calls.ts apps/mobile/src/api.ts apps/mobile/src/CallerClosedBetaScreen.tsx apps/mobile/src/ListenerActiveCallCard.tsx
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden v1.2 mobile voice recovery and polling'
          git push origin HEAD:feat/v1-2-internet-voice-foundation
