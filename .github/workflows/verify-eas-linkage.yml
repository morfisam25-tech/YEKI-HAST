name: Verify Expo EAS Linkage

on:
  workflow_dispatch:
  push:
    branches:
      - ops/verify-eas-access-20260905
    paths:
      - .github/workflows/verify-eas-linkage.yml

permissions:
  contents: read

concurrency:
  group: verify-eas-linkage
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPECTED_EXPO_OWNER: saimorfis-team
      EXPECTED_EAS_PROJECT_ID: 58b9f62d-db82-421a-ad59-edccac70c316
      EAS_CLI_VERSION: 23.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup exact Node used by mobile release
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Generate locked mobile artwork
        run: npm --workspace @yeki-hast/mobile run generate:artwork

      - name: Verify committed EAS identity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app = JSON.parse(fs.readFileSync('apps/mobile/app.json', 'utf8')).expo;
          if (app.owner !== process.env.EXPECTED_EXPO_OWNER) {
            throw new Error(`Expo owner mismatch: ${app.owner}`);
          }
          if (app.extra?.eas?.projectId !== process.env.EXPECTED_EAS_PROJECT_ID) {
            throw new Error(`EAS projectId mismatch: ${app.extra?.eas?.projectId}`);
          }
          console.log('committed Expo owner/projectId PASS');
          NODE

      - name: Require Expo access token without exposing it
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is not installed."
            exit 78
          fi
          echo "EXPO_TOKEN presence PASS"

      - name: Verify pinned EAS CLI
        run: npx --yes eas-cli@${EAS_CLI_VERSION} --version

      - name: Verify authenticated Expo identity
        working-directory: apps/mobile
        run: npx --yes eas-cli@${EAS_CLI_VERSION} whoami

      - name: Verify access to declared EAS project
        working-directory: apps/mobile
        run: npx --yes eas-cli@${EAS_CLI_VERSION} project:info

      - name: Read EAS account usage before any paid build
        working-directory: apps/mobile
        run: npx --yes eas-cli@${EAS_CLI_VERSION} account:usage ${EXPECTED_EXPO_OWNER} --json --non-interactive

      - name: Read recent EAS build history
        working-directory: apps/mobile
        run: npx --yes eas-cli@${EAS_CLI_VERSION} build:list --limit 5 --json --non-interactive
