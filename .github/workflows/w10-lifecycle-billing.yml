name: W10 Lifecycle and Billing Preview Proof

on:
  push:
    branches:
      - w10/product-audio-e2e-20260911
    paths:
      - .github/workflows/w10-lifecycle-billing.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w10-lifecycle-billing
  cancel-in-progress: false

jobs:
  lifecycle-billing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      W10_LIFECYCLE_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: w10/product-audio-e2e-20260911
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Preview-only lifecycle, billing, and idempotency proof
        run: node .github/scripts/w10-secure-preview-orchestrator.mjs
