name: W10 Product Audio E2E Preview
on:
  push:
    branches: [undefined]
    paths:
      - .github/workflows/w10-product-audio-e2e.yml
      - .github/scripts/w10-product-audio-e2e.mjs
      - services/api/src/routes/internet-voice.ts
permissions:
  contents: read
concurrency:
  group: w10-product-audio-e2e
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      VERCEL_ORG_ID: team_GmseY3ibD05FWemVhLElL3hI
      VERCEL_PROJECT_ID: prj_ijhc8kDsH24eQK5TfhFOqW8RVSxy
      VERCEL_TEAM_SLUG: unique-6ff0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0 && npx --no-install playwright install --with-deps chromium
      - name: Link and securely pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          ./node_modules/.bin/vercel pull --yes --environment=production --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG" > "$RUNNER_TEMP/w10-pull.log" 2>&1
      - name: Mint short-lived TURN in runner memory
        shell: bash
        run: |
          set -euo pipefail
          set +x
          W10_ENV_FILE=.vercel/.env.production.local W10_ICE_FILE="$RUNNER_TEMP/w10-ice.json" node --experimental-strip-types --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,unlinkSync} from 'node:fs';
          import {parseEnv} from 'node:util';
          const env=parseEnv(readFileSync(process.env.W10_ENV_FILE,'utf8'));
          const key=env.CLOUDFLARE_TURN_KEY_ID?.trim()||'',token=env.CLOUDFLARE_TURN_API_TOKEN?.trim()||'',ttl=env.CLOUDFLARE_TURN_TTL_SECONDS;
          function mask(v){if(v)process.stdout.write('::add-mask::'+v.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A')+'\n')}
          mask(key);mask(token);
          if(!key||!token)throw new Error('production_env_missing');
          if(ttl!=='14400')throw new Error('ttl_not_14400');
          process.env.CLOUDFLARE_TURN_KEY_ID=key;process.env.CLOUDFLARE_TURN_API_TOKEN=token;process.env.CLOUDFLARE_TURN_TTL_SECONDS=ttl;
          const native=globalThis.fetch;let status;
          globalThis.fetch=async(...a)=>{const r=await native(...a);if(String(a[0]).startsWith('https://rtc.live.cloudflare.com/'))status=r.status;return r};
          const {getInternetVoiceClientConfig}=await import('./services/api/src/providers/call-transport.ts');
          const config=await getInternetVoiceClientConfig();
          const ok=config.relayConfigured&&config.iceServers.some(s=>s.username&&s.credential&&[s.urls].flat().some(u=>/^turns?:/i.test(u)));
          if(status!==201||!ok)throw new Error('turn_mint_failed');
          const json=JSON.stringify(config.iceServers);for(const s of config.iceServers){mask(s.username);mask(s.credential)}mask(json);
          writeFileSync(process.env.W10_ICE_FILE,json,{mode:0o600});unlinkSync(process.env.W10_ENV_FILE);
          console.log('PRODUCTION_ENV_READ_IN_CI=PASS');console.log('SHORT_LIVED_TURN_MINT=PASS');console.log('CLOUDFLARE_HTTP=201');
          NODE
      - name: Build isolated W10 API Preview artifact
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/esbuild api/index.ts --bundle --platform=node --target=node22 --format=esm --external:pg --alias:@yeki-hast/types=./packages/types/src/index.ts --minify --outfile=dist-api/index.mjs
          node --check dist-api/index.mjs
          mkdir -p dist-api/api dist-api/.vercel
          mv dist-api/index.mjs dist-api/api/index.mjs
          printf '{"name":"yeki-hast-api-runtime","private":true,"type":"module","dependencies":{"pg":"^8.23.0"},"engines":{"node":"22.x"}}\n' > dist-api/package.json
          printf '{"framework":null,"regions":["iad1"],"buildCommand":"true","installCommand":"cd .. && npm ci --ignore-scripts --no-audit --no-fund","rewrites":[{"source":"/health","destination":"/api/index"},{"source":"/ready","destination":"/api/index"},{"source":"/v1/:path*","destination":"/api/index"}]}\n' > dist-api/vercel.json
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > dist-api/.vercel/project.json
          cp .vercel/.env.production.local dist-api/.vercel/.env.preview.local 2>/dev/null || true
          cd dist-api
          ../node_modules/.bin/vercel build --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
      - name: Deploy isolated Preview with short-lived ICE only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          set +x
          runtime_file=.vercel/.env.production.local
          runtime_env_b64=$(RUNTIME_FILE="$runtime_file" node -e 'const fs=require("node:fs");const values={};for(const line of fs.readFileSync(process.env.RUNTIME_FILE,"utf8").split(/\r?\n/)){const m=line.match(/^([A-Z][A-Z0-9_]*)=(.*)$/);if(!m||m[1].startsWith("VERCEL_")||m[1].startsWith("INTERNAL_BETA_")||m[1].startsWith("CLOUDFLARE_TURN_")||m[1]==="INTERNET_VOICE_ICE_SERVERS_JSON")continue;let v=m[2];if(v.startsWith(""")&&v.endsWith(""")){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}values[m[1]]=v}values.DATABASE_URL=process.env.PRODUCTION_DATABASE_URL;process.stdout.write(Buffer.from(JSON.stringify(values)).toString("base64"))')
          ice_json=$(<"$RUNNER_TEMP/w10-ice.json")
          echo "::add-mask::$ice_json"
          cd dist-api
          url=$(../node_modules/.bin/vercel deploy --prebuilt --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG" --env INTERNAL_BETA_OWNER_TEST_MODE=1 --env INTERNAL_BETA_ENVIRONMENT=1 --env "INTERNAL_BETA_RUNTIME_ENV_B64=$runtime_env_b64" --env "INTERNET_VOICE_ICE_SERVERS_JSON=$ice_json")
          case "$url" in https://*.vercel.app) ;; *) exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "LONG_LIVED_SECRET_EXPOSED_TO_PREVIEW=NO"
      - name: Real product bidirectional audio RTP E2E
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: node .github/scripts/w10-product-audio-e2e.mjs
      - name: Cleanup ephemeral files and Preview
        if: always()
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/w10-ice.json" .vercel/.env.production.local
          if [[ "$PREVIEW_URL" == https://*.vercel.app ]]; then
            ./node_modules/.bin/vercel remove "$PREVIEW_URL" --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          fi
