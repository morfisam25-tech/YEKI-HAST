name: W10 independent production TURN diagnostic
on:
  push:
    branches: [diag/w10-turn-runtime-20260909-final]
    paths: [.github/workflows/w10-turn-runtime-verify.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact production SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2350f89b315f8c2f4824d820795ffc884961c22e
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Install dependencies and temporary Chromium
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2350f89b315f8c2f4824d820795ffc884961c22e
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx --no-install playwright install --with-deps chromium
      - name: Secure production pull and direct relay test
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_GmseY3ibD05FWemVhLElL3hI
          VERCEL_PROJECT_ID: prj_ijhc8kDsH24eQK5TfhFOqW8RVSxy
        run: |
          set -euo pipefail
          set +x
          umask 077
          w10_dir="$(mktemp -d "$RUNNER_TEMP/w10-turn.XXXXXX")"
          trap 'rm -rf -- "$w10_dir"' EXIT
          mkdir "$w10_dir/.vercel"
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > "$w10_dir/.vercel/project.json"
          if ! (
            cd "$w10_dir"
            "$GITHUB_WORKSPACE/node_modules/.bin/vercel" pull --yes --environment=production --token "$VERCEL_TOKEN" --scope unique-6ff0
          ) > "$w10_dir/pull.log" 2>&1; then
            echo "PRODUCTION_ENV=FAIL"
            echo "DIAGNOSTIC_ERROR_CATEGORY=production_env_pull"
            exit 1
          fi
          W10_ENV_FILE="$w10_dir/.vercel/.env.production.local" node --disable-warning=ExperimentalWarning --experimental-strip-types --input-type=module <<'NODE'
          import {readFileSync, appendFileSync, unlinkSync} from 'node:fs';
          import {parseEnv} from 'node:util';
          import {chromium} from 'playwright';
          const write = process.stdout.write.bind(process.stdout);
          const summary = process.env.GITHUB_STEP_SUMMARY;
          const rows = {
            PRODUCTION_SHA: '2350f89b315f8c2f4824d820795ffc884961c22e',
            PRODUCTION_ENV: 'FAIL', KEY_ID_FORMAT: 'FAIL', TTL_14400: 'FAIL',
            TURN_CREDENTIAL_MINT: 'FAIL', CLOUDFLARE_HTTP: 'NOT_REACHED', RELAY_CONFIGURED: 'NO', TURN_URL_PRESENT: 'NO',
            SELECTED_ICE: 'FAIL', RELAY_PACKET_DATA: 'FAIL',
            MARKETPLACE_AUDIO: 'BLOCKED_BY_APPROVED_LISTENER',
            CODE_CHANGES: 'NONE_DIAGNOSTIC_WORKFLOW_ONLY', PRODUCTION_DEPLOY: 'NO',
            CALLER_PUBLIC: 'NOT_VERIFIED',
          };
          function mask(value) {
            if (!value) return;
            const escaped = value.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');
            write('::add-mask::' + escaped + '\n');
          }
          let browser;
          let stage = 'env_parse';
          try {
            // Parse using Node's dotenv parser; never execute/shell-source the env file.
            const env = parseEnv(readFileSync(process.env.W10_ENV_FILE, 'utf8'));
            mask(env.CLOUDFLARE_TURN_KEY_ID);
            mask(env.CLOUDFLARE_TURN_API_TOKEN);
            unlinkSync(process.env.W10_ENV_FILE);
            // Only import transport-related env into this process. Keep runner/tool config isolated.
            for (const [key,value] of Object.entries(env)) {
              if (/^(CLOUDFLARE_TURN_|INTERNET_VOICE_|CALL_PRIMARY_TRANSPORT$|CALL_FALLBACK_TRANSPORT$|TELEPHONY_PROVIDER$|NODE_ENV$)/.test(key)) process.env[key]=value;
            }
            rows.TURN_KEY_ID_PRESENT=Boolean(env.CLOUDFLARE_TURN_KEY_ID?.trim());
            rows.TURN_API_TOKEN_PRESENT=Boolean(env.CLOUDFLARE_TURN_API_TOKEN?.trim());
            rows.PRODUCTION_ENV=rows.TURN_KEY_ID_PRESENT && rows.TURN_API_TOKEN_PRESENT ? 'PASS':'FAIL';
            rows.KEY_ID_FORMAT=/^[A-Za-z0-9_-]{8,128}$/.test(env.CLOUDFLARE_TURN_KEY_ID?.trim() ?? '') ? 'PASS':'FAIL';
            rows.TTL_14400=env.CLOUDFLARE_TURN_TTL_SECONDS === '14400' ? 'PASS':'FAIL';
            rows.COMMERCIAL_HOSTING_APPROVED_FALSE=env.COMMERCIAL_HOSTING_APPROVED?.trim() === 'false';
            try {
              const res=await fetch('https://yeki-hast-unique-6ff0.vercel.app/v1/bootstrap',{signal:AbortSignal.timeout(10000)});
              const body=await res.json();
              if(res.ok && body.features?.callerClosedBetaEnabled === false) rows.CALLER_PUBLIC='CLOSED';
            } catch {}
            stage='helper_import';
            // Suppress library debug/error output. Only explicitly whitelisted metadata is emitted.
            for (const name of ['log','info','warn','error','debug','trace']) console[name]=()=>{};
            const {getInternetVoiceClientConfig}=await import('./services/api/src/providers/call-transport.ts');
            const nativeFetch=globalThis.fetch;
            let cfStatus;
            globalThis.fetch=async (...args)=>{
              const response=await nativeFetch(...args);
              if (String(args[0]).startsWith('https://rtc.live.cloudflare.com/v1/turn/keys/')) cfStatus=response.status;
              return response;
            };
            stage='credential_mint';
            let config;
            try { config=await getInternetVoiceClientConfig(); }
            catch(error){
              const allowed=new Set(['invalid_cloudflare_turn_config','invalid_cloudflare_turn_ttl','cloudflare_turn_credentials_unavailable','invalid_internet_voice_ice_servers','invalid_call_transport','invalid_call_fallback_transport']);
              rows.TURN_ERROR_CATEGORY=allowed.has(error?.message)?error.message:'helper_error';
              if(Number.isInteger(cfStatus)) rows.TURN_HTTP_STATUS=cfStatus;
              throw new Error('classified_helper_failure');
            } finally { globalThis.fetch=nativeFetch; }
            rows.CLOUDFLARE_HTTP=Number.isInteger(cfStatus) ? String(cfStatus) : 'NOT_REACHED';
            for(const server of config.iceServers){ mask(server.username); mask(server.credential); }
            const hasTurn=config.iceServers.some(s=>(Array.isArray(s.urls)?s.urls:[s.urls]).some(u=>/^turns?:/i.test(u)));
            const hasCredentials=config.iceServers.some(s=>s.username && s.credential && (Array.isArray(s.urls)?s.urls:[s.urls]).some(u=>/^turns?:/i.test(u)));
            rows.RELAY_CONFIGURED=config.relayConfigured === true?'YES':'NO';
            rows.TURN_URL_PRESENT=hasTurn?'YES':'NO';
            if(cfStatus !== 201 || !hasCredentials || !hasTurn || config.relayConfigured !== true) throw new Error('invalid_mint_result');
            rows.TURN_CREDENTIAL_MINT='PASS';
            stage='chromium_relay';
            // Chromium sees only short-lived ICE config, never production API credentials.
            const browserEnv={...process.env};
            for(const key of Object.keys(browserEnv)) if(/^(CLOUDFLARE_|INTERNET_VOICE_|VERCEL_TOKEN|GH_TOKEN|GITHUB_TOKEN)/.test(key)) delete browserEnv[key];
            browser=await chromium.launch({headless:true,env:browserEnv});
            const page=await browser.newPage();
            const result=await page.evaluate(async (iceServers)=>{
              const a=new RTCPeerConnection({iceServers,iceTransportPolicy:'relay'});
              const b=new RTCPeerConnection({iceServers,iceTransportPolicy:'relay'});
              const wait=async(fn)=>{
                const until=Date.now()+60000;
                while(!fn()){if(Date.now()>until) throw new Error('relay_timeout'); await new Promise(r=>setTimeout(r,100));}
              };
              let aReceived=false,bReceived=false,bChannel;
              const payloadA='W10-A-'+ 'a'.repeat(16384),payloadB='W10-B-'+ 'b'.repeat(16384);
              try {
                b.ondatachannel=e=>{
                  bChannel=e.channel;
                  bChannel.onmessage=e=>{bReceived=e.data===payloadA;};
                };
                const aChannel=a.createDataChannel('w10-relay');
                aChannel.onmessage=e=>{aReceived=e.data===payloadB;};
                await a.setLocalDescription(await a.createOffer());
                await wait(()=>a.iceGatheringState==='complete');
                await b.setRemoteDescription(a.localDescription);
                await b.setLocalDescription(await b.createAnswer());
                await wait(()=>b.iceGatheringState==='complete');
                await a.setRemoteDescription(b.localDescription);
                await wait(()=>a.connectionState==='connected' && b.connectionState==='connected' && aChannel.readyState==='open' && bChannel?.readyState==='open');
                aChannel.send(payloadA); bChannel.send(payloadB);
                await wait(()=>aReceived && bReceived);
                async function inspect(pc){
                  const stats=await pc.getStats();
                  const transport=[...stats.values()].find(s=>s.type==='transport' && s.selectedCandidatePairId);
                  const pair=transport && stats.get(transport.selectedCandidatePairId);
                  const relay=pair?.state==='succeeded' && stats.get(pair.localCandidateId)?.candidateType==='relay' && stats.get(pair.remoteCandidateId)?.candidateType==='relay';
                  return {relay,packets:relay && pair.bytesSent>0 && pair.bytesReceived>0};
                }
                let checks;
                const deadline=Date.now()+10000;
                do {
                  checks=await Promise.all([inspect(a),inspect(b)]);
                  if(checks.every(c=>c.packets)) break;
                  await new Promise(r=>setTimeout(r,200));
                } while(Date.now()<deadline);
                return {relay:checks.every(c=>c.relay),packets:aReceived && bReceived && checks.every(c=>c.packets)};
              } finally {a.close();b.close();}
            },config.iceServers);
            rows.SELECTED_ICE=result.relay?'RELAY':'FAIL';
            rows.RELAY_PACKET_DATA=result.packets?'PASS':'FAIL';
          } catch {
            if(!rows.TURN_ERROR_CATEGORY) rows.DIAGNOSTIC_ERROR_CATEGORY=stage;
          } finally {
            try { if(browser) await browser.close(); } catch {}
            for(const [key,value] of Object.entries(rows)) write(key+'='+value+'\n');
            appendFileSync(summary,Object.entries(rows).map(([k,v])=>k+'='+v).join('\n')+'\n');
            process.exitCode=rows.PRODUCTION_ENV==='PASS' && rows.TTL_14400==='PASS' && rows.TURN_CREDENTIAL_MINT==='PASS' && rows.RELAY_PACKET_DATA==='PASS'?0:1;
          }
          
          NODE
