name: W13 Android QA

on:
  push:
    branches:
      - w13/android-play-finalization-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Foundation tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Android native prebuild
        env:
          CI: '1'
          EXPO_PUBLIC_API_BASE_URL: https://yeki-hast-unique-6ff0.vercel.app
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --clean --no-install
          test -f android/app/src/main/AndroidManifest.xml

      - name: Android JS export
        env:
          EXPO_PUBLIC_API_BASE_URL: https://yeki-hast-unique-6ff0.vercel.app
        run: npm --workspace @yeki-hast/mobile run export:android
