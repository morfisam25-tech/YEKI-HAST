name: W13 Android Store Screenshots

on:
  push:
    branches:
      - w13/android-play-finalization-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8787
      CI: '1'
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate release-equivalent x86_64 APK for screenshots
        shell: bash
        run: |
          set -euo pipefail
          npm --workspace @yeki-hast/mobile run generate:artwork
          cd apps/mobile
          npx expo prebuild --platform android --clean --no-install
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1)
          p.write_text(s)
          PY
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Upload release-mode screenshot APK
        uses: actions/upload-artifact@v4
        with:
          name: w13-release-screenshot-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  screenshots:
    needs: build-release-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release-mode APK
        uses: actions/download-artifact@v4
        with:
          name: w13-release-screenshot-apk
          path: screenshot-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture actual release UI against current production bootstrap
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash .github/scripts/w13-capture-screenshots.sh

      - name: Upload Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: w13-android-store-screenshots
          path: store-screenshots/0*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload screenshot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: w13-android-screenshot-diagnostics
          path: store-screenshots
          if-no-files-found: ignore
          retention-days: 2
