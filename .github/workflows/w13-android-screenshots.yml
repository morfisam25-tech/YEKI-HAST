name: W13 Android Store Screenshots

on:
  push:
    branches:
      - w13/android-play-finalization-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: https://yeki-hast-unique-6ff0.vercel.app
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Android project and debug APK
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --clean --no-install
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture actual app UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            mkdir -p store-screenshots
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            cd apps/mobile
            (npx expo start --localhost --clear > /tmp/w13-metro.log 2>&1 &)
            cd ../..
            adb reverse tcp:8081 tcp:8081
            sleep 8
            adb shell monkey -p app.yekihast.mobile -c android.intent.category.LAUNCHER 1
            sleep 15

            tap_text() {
              NEEDLE="$1"
              adb shell uiautomator dump /sdcard/w13-window.xml >/dev/null
              adb exec-out cat /sdcard/w13-window.xml > /tmp/w13-window.xml
              python3 - "$NEEDLE" <<'PY'
            import re, subprocess, sys, xml.etree.ElementTree as ET
            needle = sys.argv[1]
            root = ET.parse('/tmp/w13-window.xml').getroot()
            for node in root.iter('node'):
                text = node.attrib.get('text', '')
                desc = node.attrib.get('content-desc', '')
                if needle in text or needle in desc:
                    m = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
                    if not m:
                        continue
                    x1,y1,x2,y2 = map(int, m.groups())
                    subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
                    sys.exit(0)
            print('Could not find UI text:', needle, file=sys.stderr)
            print(open('/tmp/w13-window.xml', encoding='utf-8').read(), file=sys.stderr)
            sys.exit(1)
            PY
              sleep 3
            }

            adb exec-out screencap -p > store-screenshots/01-home.png
            tap_text 'وضعیت گفت‌وگو'
            adb exec-out screencap -p > store-screenshots/02-caller-closed.png

            adb shell am force-stop app.yekihast.mobile
            adb shell monkey -p app.yekihast.mobile -c android.intent.category.LAUNCHER 1
            sleep 6
            tap_text 'می‌خوام شنونده بشم'
            adb exec-out screencap -p > store-screenshots/03-listener-intro.png
            tap_text 'ادامه با ایمیل'
            adb exec-out screencap -p > store-screenshots/04-email-auth.png

            file store-screenshots/*.png
            python3 - <<'PY'
            from pathlib import Path
            from PIL import Image
            for p in sorted(Path('store-screenshots').glob('*.png')):
                im = Image.open(p)
                assert im.size == (1080, 1920), (p, im.size)
                assert im.mode in ('RGB', 'RGBA'), (p, im.mode)
                print(p, im.size, im.mode)
            PY

      - name: Upload Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: w13-android-store-screenshots
          path: store-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
