name: W14 Owner Test Preview

on:
  push:
    branches:
      - w14/listener-internal-beta-readiness-clean-20260909

permissions:
  contents: read

concurrency:
  group: w14-owner-test-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_GmseY3ibD05FWemVhLElL3hI
      VERCEL_ORG_ID: team_GmseY3ibD05FWemVhLElL3hI
      VERCEL_TEAM_SLUG: unique-6ff0
      VERCEL_PROJECT_ID: prj_ijhc8kDsH24eQK5TfhFOqW8RVSxy
      VERCEL_BIN: ${{ github.workspace }}/node_modules/.bin/vercel
      ESBUILD_BIN: ${{ github.workspace }}/node_modules/.bin/esbuild
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Foundation QA
        run: npm run validate:foundation

      - name: Build isolated API artifact
        shell: bash
        run: |
          set -euo pipefail
          "$ESBUILD_BIN" api/index.ts \
            --bundle \
            --platform=node \
            --target=node22 \
            --format=esm \
            --external:pg \
            --alias:@yeki-hast/types=./packages/types/src/index.ts \
            --minify \
            --outfile=dist-api/index.mjs
          node --check dist-api/index.mjs
          mkdir -p dist-api/api dist-api/.vercel
          mv dist-api/index.mjs dist-api/api/index.mjs
          cat > dist-api/package.json <<'JSON'
          {
            "name": "yeki-hast-api-runtime",
            "private": true,
            "type": "module",
            "dependencies": { "pg": "^8.23.0" },
            "engines": { "node": "22.x" }
          }
          JSON
          cat > dist-api/vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": null,
            "regions": ["iad1"],
            "installCommand": "cd .. && npm ci --ignore-scripts --no-audit --no-fund",
            "rewrites": [
              { "source": "/health", "destination": "/api/index" },
              { "source": "/ready", "destination": "/api/index" },
              { "source": "/v1/:path*", "destination": "/api/index" }
            ]
          }
          JSON
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$VERCEL_PROJECT_ID" > dist-api/.vercel/project.json

      - name: Pull API production runtime configuration for isolated Preview
        working-directory: dist-api
        run: "$VERCEL_BIN" pull --yes --environment=production --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"

      - name: Build prebuilt Preview artifact
        working-directory: dist-api
        run: "$VERCEL_BIN" build --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"

      - name: Deploy Preview only
        id: deploy
        working-directory: dist-api
        shell: bash
        run: |
          set -euo pipefail
          url=$("$VERCEL_BIN" deploy --prebuilt --yes \
            --env INTERNAL_BETA_OWNER_TEST_MODE=1 \
            --env INTERNAL_BETA_ENVIRONMENT=1 \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG")
          case "$url" in
            https://*.vercel.app) ;;
            *) echo "Unexpected Preview URL" >&2; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### W14 Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url/v1/internal-beta/owner-test" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove Production hard block and Preview E2E
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PRODUCTION_URL: https://yeki-hast-unique-6ff0.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.PREVIEW_URL;
          const production = process.env.PRODUCTION_URL;
          async function json(path, token, method='GET', body) {
            const response = await fetch(base+path, {
              method,
              headers: {
                ...(token ? {authorization:'Bearer '+token} : {}),
                ...(body ? {'content-type':'application/json'} : {}),
              },
              body: body ? JSON.stringify(body) : undefined,
            });
            const payload = await response.json().catch(()=>({}));
            if (!response.ok) throw new Error(path+':'+response.status+':'+(payload.error||'unknown'));
            return payload;
          }
          const page = await fetch(base+'/v1/internal-beta/owner-test');
          if (page.status !== 200 || !(await page.text()).includes('INTERNAL TEST DATA')) throw new Error('preview_owner_test_page_failed');
          const prod = await fetch(production+'/v1/internal-beta/owner-test', {redirect:'manual'});
          if (![403,404].includes(prod.status)) throw new Error('production_owner_test_mode_not_blocked:'+prod.status);
          console.log('PRODUCTION_HARD_BLOCK=PASS');
          const boot = await json('/v1/internal-beta/owner-test/bootstrap','', 'POST');
          const listener = boot.sessions.listener;
          const caller = boot.sessions.caller;
          await json('/v1/listener/presence',listener,'POST',{status:'online',acceptsMale:true,acceptsFemale:true});
          await json('/v1/listener/presence/heartbeat',listener,'POST',{});
          console.log('PRESENCE_HEARTBEAT=PASS');
          const market = await json('/v1/listeners?online=true&language=fa',caller);
          if (!market.listeners.some((item)=>item.id===boot.listener.id)) throw new Error('marketplace_visibility_failed');
          console.log('MARKETPLACE_INTERNAL_VISIBLE=YES');
          const quote = await json('/v1/caller/quote?maxSeconds=600&target=instant',caller);
          if (!quote.wallet.enough) throw new Error('internal_credit_failed');
          const call = await json('/v1/calls/request',caller,'POST',{
            clientRequestId:'w14-proof-'+Date.now(),listenerId:boot.listener.id,
            listenerGender:'any',languageCode:'fa',mood:'just_talk',
            topicCode:'internal_owner_test',maxSeconds:600,
          });
          await json('/v1/calls/'+call.callId+'/voice/start',caller,'POST',{});
          await json('/v1/calls/'+call.callId+'/voice/signals',caller,'POST',{kind:'offer',payload:{type:'offer',sdp:'w14-preview-proof-offer'}});
          const active = await json('/v1/listener/calls/active',listener);
          if (active.activeCall?.callId !== call.callId) throw new Error('listener_receive_failed');
          console.log('CALL_REQUEST_RECEIVED=YES');
          await json('/v1/calls/'+call.callId+'/voice/signals',listener,'POST',{kind:'answer',payload:{type:'answer',sdp:'w14-preview-proof-answer'}});
          const signals = await json('/v1/calls/'+call.callId+'/voice/signals',caller);
          if (!signals.signals.some((item)=>item.kind==='answer'&&item.senderRole==='listener')) throw new Error('listener_accept_failed');
          console.log('CALL_ACCEPTED=YES');
          console.log('SIGNALING_STAGE=READY_FOR_REAL_WEBRTC');
          NODE
