name: W15 SMS.ir Reachability

on:
  workflow_dispatch:
  push:
    branches:
      - w15/sms-auth-readiness-20260911
    paths:
      - .github/workflows/w15-smsir-connectivity.yml

permissions:
  contents: read

jobs:
  reachability:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS TLS and HTTP reachability
        shell: bash
        run: |
          set -euo pipefail
          getent ahosts api.sms.ir | head -n 3
          curl --fail-with-body --silent --show-error --head --connect-timeout 10 --max-time 15 https://api.sms.ir/v1/line || status=$?
          test "${status:-0}" -ne 6
          test "${status:-0}" -ne 7
          test "${status:-0}" -ne 35
          test "${status:-0}" -ne 60
