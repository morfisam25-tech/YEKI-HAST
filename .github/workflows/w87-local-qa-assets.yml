name: W87 Local QA Assets

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa-assets:
    if: github.head_ref == 'w87/integrated-web-rc-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout W87 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup exact Node used by release tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install workspace dependencies from lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Listener approval runtime DB suite on disposable runner-local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          PG_INITDB="$(find /usr/lib/postgresql -type f -path '*/bin/initdb' 2>/dev/null | sort -V | tail -1)"
          test -n "$PG_INITDB"
          export PG_BINDIR="$(dirname "$PG_INITDB")"
          set -o pipefail
          npm run test:listener-approval-runtime-db 2>&1 | tee w87-listener-runtime-db.log
      - name: Package exact Node and lock-installed dependencies for local QA
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          tar -C "$NODE_ROOT" -czf w87-node-22.23.1.tgz .
          tar -czf w87-node-modules.tgz node_modules
      - name: Upload W87 local QA assets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: w87-local-qa-assets
          path: |
            w87-listener-runtime-db.log
            w87-node-22.23.1.tgz
            w87-node-modules.tgz
          if-no-files-found: error
          retention-days: 1
