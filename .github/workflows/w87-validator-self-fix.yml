name: W87 Validator Self-Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-validator:
    if: github.head_ref == 'w87/integrated-web-rc-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout W87 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: w87/integrated-web-rc-20260919
          fetch-depth: 0
      - name: Apply exact validator-only correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/validate-foundation.mjs')
          s = p.read_text()
          old = '''  ['mobile Production API base URL behavior remains separately fail-closed',
              mobileApiTs.includes("env === 'production' && !rawBaseUrl")
                && mobileApiTs.includes('EXPO_PUBLIC_API_BASE_URL is required in production')
                && mobileApiTs.includes("env === 'production' && !isProductionApiOrigin(configuredApiBase)")
                && mobileApiTs.includes('Production builds must use the Production API origin')],'''
          new = '''  ['mobile Production API base URL behavior remains explicit and pinned to the canonical Production origin',
              mobileApiTs.includes("if (env === 'production') {")
                && mobileApiTs.includes("return (configured || PRODUCTION_API_BASE_URL).replace(/\\\\/$/, '');")
                && mobileApiTs.includes("export const PRODUCTION_API_BASE_URL = 'https://yeki-hast-unique-6ff0.vercel.app';")
                && (() => {
                  const eas = JSON.parse(mobileEasJson);
                  return eas.build.production.env.EXPO_PUBLIC_APP_ENV === 'production'
                    && eas.build.production.env.EXPO_PUBLIC_API_BASE_URL === 'https://yeki-hast-unique-6ff0.vercel.app';
                })()],'''
          if old not in s:
              raise SystemExit('expected old validator block not found')
          s2 = s.replace(old, new, 1)
          if s2.count('mobile Production API base URL behavior remains separately fail-closed') != 0:
              raise SystemExit('stale Production invariant remains')
          p.write_text(s2)
          PY
          node --check scripts/validate-foundation.mjs
          npm run validate:foundation
          git diff --check
          test "$(git diff --name-only)" = "scripts/validate-foundation.mjs"
      - name: Commit exact validator correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-foundation.mjs
          git commit -m 'fix(qa): align mobile production invariant with established contract'
          git push origin HEAD:w87/integrated-web-rc-20260919
